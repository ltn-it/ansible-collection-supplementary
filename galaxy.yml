---
namespace: lit
name: supplementary
version: 4.1.0
readme: README.md
description: 'Supplementary Ansible collection for ModuLix, providing configuration
  and integration roles for platform services and Terraform-backed workflows.

  '
repository: https://github.com/lightning-it/ansible-collection-supplementary
authors:
  - Lightning IT
license:
  - MIT
tags:
  - modulix
  - keycloak
  - terraform
  - security
  - automation
dependencies:
  amazon.aws: 10.3.2
  community.aws: 10.1.1
  community.general: '>=11.4.9,<12.0.0'
  community.crypto: '>=3.2.2,<4.0.0'
  ansible.posix: '>=2.1.0'
  community.vmware: 5.10.0
  lit.foundational: '>=1.35.0'
  lit.rhel: '>=1.17.1'
  community.hashi_vault: 7.1.0
build_ignore:
  - .ansible
  - .cache
  - .lit
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .tox
  - .venv
  - artifacts
  - build
  - dist
  - extensions
  - molecule
  - tests
  - pyproject.toml
  - node_modules
  - .git
  - .github
  - .gitignore
