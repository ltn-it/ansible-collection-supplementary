          candidate="incoming/candidate/${CANDIDATE_NAME}"
          candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          if [ "$SECURITY_RELEASE" = true ]; then
            test -s "$MODULIX_VALIDATION_RECEIPT"
            test -s "${MODULIX_VALIDATION_RECEIPT}.sigstore.json"
            test "$MODULIX_VALIDATION_RECEIPT_SHA256" = \
              "sha256:$(sha256sum "$MODULIX_VALIDATION_RECEIPT" | awk '{print $1}')"
            jq -e \
              --arg digest "sha256:$candidate_sha" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg request_id "$MODULIX_VALIDATION_REQUEST_ID" \
              --arg run_attempt "$MODULIX_VALIDATION_RUN_ATTEMPT" \
              --arg run_id "$MODULIX_VALIDATION_RUN_ID" \
              --arg sha "$RELEASE_SHA" '
              .apiVersion == "lit.mlx90.collection-validation-receipt/v2"
              and .kind == "CollectionValidationReceipt"
              and .request.source.repository == $repository
              and .request.source.sha == $sha
              and .request.source.actor == "lightning-it-release-automation[bot]"
              and .request.source.actorId == 307565056
              and .request.source.actorType == "Bot"
              and .request.source.event == "workflow_dispatch"
              and .request.source.ref == "refs/heads/main"
              and (.request.source.runId | tostring) == env.GITHUB_RUN_ID
              and (.request.source.runAttempt | tostring) == env.GITHUB_RUN_ATTEMPT
              and .request.candidate.sha256 == $digest
              and .request.security.humanActions == 0
              and .requestId == $request_id
              and (.validation.runId | tostring) == $run_id
              and (.validation.runAttempt | tostring) == $run_attempt
              and .validation.actor == "lightning-it-release-automation[bot]"
              and .validation.actorId == 307565056
              and .validation.actorType == "Bot"
              and .validation.humanActions == 0
              and .validation.conclusion == "success"
              and .decision.candidateUnchanged == true
              and .decision.galaxyPublicationAuthorized == true
              and .decision.releaseEligible == true
            ' "$MODULIX_VALIDATION_RECEIPT" >/dev/null
          fi
          version_url="https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/lit/supplementary/versions/${RELEASE_VERSION}/"
          response="$RUNNER_TEMP/galaxy-version.json"
          status="$(
            curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              "$version_url"
          )"

          if [ "$status" = 404 ]; then
            if [ "${LEGACY_NORMAL_RECHECK:-false}" = true ]; then
              echo 'Legacy normal recheck cannot create a Galaxy version.' >&2
              exit 1
            fi
            ansible-galaxy collection publish "$candidate" \
              --api-key "$GALAXY_API_TOKEN"
          elif [ "$status" != 200 ]; then
            echo "Unexpected Galaxy version API status: $status" >&2
            exit 1
          fi

          for attempt in $(seq 1 60); do
            status="$(
              curl --silent --show-error \
                --output "$response" \
                --write-out '%{http_code}' \
                "$version_url"
            )"
            if [ "$status" = 200 ]; then
              break
            fi
            if [ "$status" != 404 ]; then
              echo "Unexpected Galaxy verification status: $status" >&2
              exit 1
            fi
            echo "Waiting for Galaxy import (attempt $attempt/60)."
            sleep 10
          done
          test "$status" = 200

          galaxy_download_url="$(EXPECTED_SHA="$candidate_sha" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("galaxy-version.json").read_text())
          artifact = payload.get("artifact") or {}
          if artifact.get("filename") != os.environ["CANDIDATE_NAME"]:
              raise SystemExit("Galaxy artifact filename mismatch")
          if artifact.get("sha256") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Galaxy artifact digest mismatch")
          download_url = payload.get("download_url")
          if not isinstance(download_url, str) or not download_url.startswith("https://"):
              raise SystemExit("Galaxy download URL is missing or unsafe")
          print(download_url)
          PY
          )"

          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/galaxy-${CANDIDATE_NAME}" \
