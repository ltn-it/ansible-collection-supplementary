          install_root="$RUNNER_TEMP/galaxy-release-install"
          ansible-galaxy collection install \
            "lit.supplementary:==${RELEASE_VERSION}" \
            -p "$install_root" \
            --force
          ANSIBLE_COLLECTIONS_PATH="$install_root" \
            ansible-doc --type role lit.supplementary.keycloak_deploy >/dev/null
          installed_playbook="$install_root/ansible_collections/lit/supplementary/playbooks/example.yml"
          test -s "$installed_playbook"
          ANSIBLE_COLLECTIONS_PATH="$install_root" \
            ansible-playbook --syntax-check "$installed_playbook"
          fi
      - name: Prepare completed normal publication evidence
        if: env.NORMAL_TWO_STAGE == 'true'
        id: normal-completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test "$SECURITY_RELEASE" = false
          observations="$GITHUB_WORKSPACE/.normal-completion-observations"
          fresh="$GITHUB_WORKSPACE/.normal-completion-fresh"
          bash scripts/normal_release_observations.sh completion \
            "$observations" "$GITHUB_REPOSITORY" "$RELEASE_SHA"
          mkdir "$RUNNER_TEMP/normal-completion-ee"
          release_path="repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          release_file="$(jq -er --arg path "$release_path" '.calls[$path]' "$observations/index.json")"
          verifier_network=none
          if jq -e '.assets | any(.name == "post-release-verification.json")' \
              "$observations/$release_file" >/dev/null; then
            verifier_network=bridge
          fi
          WUNDER_DEVTOOLS_NETWORK="$verifier_network" bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            mkdir "$HOME/output"
            test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
            python3 -B scripts/normal_release_archive.py --operation completion-prepare \
              --directory /workspace/dist/release --output "$HOME/output/normal-completion" \
              --repository "$1" --repository-id "$2" --release "$3" --version "$4" --galaxy-required "$5" \
              --observation-directory /workspace/.normal-completion-observations >"$HOME/output/reused"
            tar -C "$HOME/output" -cf - normal-completion reused
          ' normal-completion "$GITHUB_REPOSITORY" "$REPOSITORY_ID" "$RELEASE_SHA" \
            "$RELEASE_VERSION" "$GALAXY_REQUIRED" | tar -xf - -C "$RUNNER_TEMP/normal-completion-ee"
          bash scripts/normal_release_observations.sh fresh \
            "$fresh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$observations"
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            cp -a --no-preserve=ownership /workspace/release-control-source "$HOME/control"
            python3 -B scripts/normal_release_proof.py freshness \
              --root /workspace --base "$1" --control-root "$HOME/control" --repository "$2" --repository-id "$3" \
              --observation-directory /workspace/.normal-completion-observations \
              --fresh-observation-directory /workspace/.normal-completion-fresh
          ' normal-completion-freshness "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$REPOSITORY_ID"
          mv "$RUNNER_TEMP/normal-completion-ee/normal-completion" "$RUNNER_TEMP/normal-completion"
          echo "reused=$(cat "$RUNNER_TEMP/normal-completion-ee/reused")" >>"$GITHUB_OUTPUT"

      - name: Attest completed normal publication
        if: env.NORMAL_TWO_STAGE == 'true' && steps.normal-completion.outputs.reused != 'true'
        id: attest-normal-completion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/normal-completion/post-release-verification.json

      - name: Publish and verify completed normal publication evidence
        if: env.NORMAL_TWO_STAGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          COMPLETION_REUSED: ${{ steps.normal-completion.outputs.reused }}
          COMPLETION_BUNDLE: ${{ steps.attest-normal-completion.outputs.bundle-path }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/normal-completion/post-release-verification.json"
          bundle="${receipt}.sigstore.json"
          if [ "$COMPLETION_REUSED" != true ]; then
            test -s "$COMPLETION_BUNDLE"
            cp "$COMPLETION_BUNDLE" "$bundle"
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-publish.yml@refs/heads/main"
            mkdir "$GITHUB_WORKSPACE/.normal-completion-local"
            cp "$receipt" "$bundle" "$GITHUB_WORKSPACE/.normal-completion-local/"
            WUNDER_DEVTOOLS_NETWORK=bridge bash scripts/wunder-devtools-ee.sh gh attestation verify \
              .normal-completion-local/post-release-verification.json \
              --bundle .normal-completion-local/post-release-verification.json.sigstore.json \
              --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" \
              --source-ref refs/heads/main --source-digest "$RELEASE_SHA"
            # No clobber or retry: a partial/unknown upload requires actual readback.
            gh release upload "$RELEASE_TAG" "$receipt" "$bundle" --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$COMPLETION_REUSED" = true ]; then
            mkdir "$GITHUB_WORKSPACE/.normal-completion-local"
            cp "$receipt" "$bundle" "$GITHUB_WORKSPACE/.normal-completion-local/"
          fi
          observations="$GITHUB_WORKSPACE/.normal-completion-readback-observations"
          fresh="$GITHUB_WORKSPACE/.normal-completion-readback-fresh"
          bash scripts/normal_release_observations.sh completion \
            "$observations" "$GITHUB_REPOSITORY" "$RELEASE_SHA"
          WUNDER_DEVTOOLS_NETWORK=bridge bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
            python3 -B scripts/normal_release_archive.py --operation completion-verify \
              --directory "$HOME/normal-completion-readback" \
              --repository "$1" --repository-id "$2" --release "$3" --version "$4" --galaxy-required "$5" \
              --observation-directory /workspace/.normal-completion-readback-observations
            cmp .normal-completion-local/post-release-verification.json \
              "$HOME/normal-completion-readback/post-release-verification.json"
            cmp .normal-completion-local/post-release-verification.json.sigstore.json \
              "$HOME/normal-completion-readback/post-release-verification.json.sigstore.json"
          ' normal-completion-readback "$GITHUB_REPOSITORY" "$REPOSITORY_ID" "$RELEASE_SHA" \
            "$RELEASE_VERSION" "$GALAXY_REQUIRED"
          bash scripts/normal_release_observations.sh fresh \
            "$fresh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$observations"
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            cp -a --no-preserve=ownership /workspace/release-control-source "$HOME/control"
            python3 -B scripts/normal_release_proof.py freshness \
              --root /workspace --base "$1" --control-root "$HOME/control" --repository "$2" --repository-id "$3" \
              --observation-directory /workspace/.normal-completion-readback-observations \
              --fresh-observation-directory /workspace/.normal-completion-readback-fresh
          ' normal-completion-final-freshness "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$REPOSITORY_ID"

      - name: Mint exact back-sync dispatch App token
        if: >-
          (env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true') &&
          env.LEGACY_NORMAL_RECHECK != 'true'
        id: back-sync-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Trigger release back-sync after verified publication
        if: >-
          (env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true') &&
          env.LEGACY_NORMAL_RECHECK != 'true'
        env:
          GH_TOKEN: ${{ steps.back-sync-app.outputs.token }}
          RELEASE_TAG_APP_SLUG: ${{ steps.release-tag-token.outputs.app-slug }}
          RELEASE_TAG_APP_ID: ${{ vars.RELEASE_TAG_APP_ID }}
          RELEASE_TAG_APP_CLIENT_ID: ${{ vars.RELEASE_TAG_APP_CLIENT_ID }}
          SECURITY_EVIDENCE_ID: ${{ needs.security-classification.outputs.security-evidence-id }}
        run: |
          set -euo pipefail
          gh workflow run release-back-sync.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f release_tag_app_slug="$RELEASE_TAG_APP_SLUG" \
            -f release_tag_app_id="$RELEASE_TAG_APP_ID" \
            -f release_tag_app_client_id="$RELEASE_TAG_APP_CLIENT_ID" \
            -f security_evidence_id="$SECURITY_EVIDENCE_ID"

      - name: Attach signed post-publication verification receipt
        if: >-
          (env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true') &&
          env.NORMAL_TWO_STAGE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_root="dist/post-release"
          mkdir -p "$receipt_root"
          RECEIPT_ROOT="$receipt_root" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RECEIPT_ROOT"])
          candidate = Path("incoming/candidate") / os.environ["CANDIDATE_NAME"]
          galaxy_required = os.environ["GALAXY_REQUIRED"] == "true"
          security_validation = None
          if os.environ["SECURITY_RELEASE"] == "true":
              receipt_path = Path(os.environ["MODULIX_VALIDATION_RECEIPT"])
              nexus_path = Path("dist/validation/nexus-stage.json")
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              nexus = json.loads(nexus_path.read_text(encoding="utf-8"))
              receipt_digest = "sha256:" + hashlib.sha256(receipt_path.read_bytes()).hexdigest()
              if receipt_digest != os.environ["MODULIX_VALIDATION_RECEIPT_SHA256"]:
                  raise SystemExit("ModuLix validation receipt changed after verification")
              security_validation = {
                  "humanActions": 0,
                  "nexus": {
                      "repository": nexus["repository"]["name"],
                      "readbackSha256": nexus["readback"]["sha256"],
                  },
                  "receipt": {
                      "requestId": receipt["requestId"],
                      "sha256": receipt_digest,
                  },
                  "run": {
                      "attempt": receipt["validation"]["runAttempt"],
                      "id": receipt["validation"]["runId"],
                      "repository": receipt["validation"]["repository"],
                      "sha": receipt["validation"]["sha"],
                      "workflow": receipt["validation"]["workflow"],
                  },
              }
          gates = {
              "github_release_assets_verified": True,
              "github_release_install_smoke": True,
              "galaxy_artifact_verified_or_not_required": True,
              "galaxy_install_smoke_or_not_required": True,
              "release_back_sync_dispatched": True,
          }
          if security_validation is not None:
              gates["security_validation_verified"] = True
          payload = {
              "schema_version": 2 if security_validation is not None else 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["RELEASE_SHA"],
              "release_tag": os.environ["RELEASE_TAG"],
              "collection_version": os.environ["RELEASE_VERSION"],
              "candidate": {
                  "name": candidate.name,
                  "sha256": hashlib.sha256(candidate.read_bytes()).hexdigest(),
              },
              "github_release_url": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/"
                  f"{os.environ['RELEASE_TAG']}"
              ),
              "galaxy_required": galaxy_required,
              "galaxy_version": os.environ["RELEASE_VERSION"] if galaxy_required else None,
              "back_sync": {
                  "workflow": "release-back-sync.yml",
                  "ref": "main",
                  "tag": os.environ["RELEASE_TAG"],
                  "dispatch_accepted": True,
              },
              "verified": all(gates.values()),
              "gates": gates,
          }
          if security_validation is not None:
              payload["security_validation"] = security_validation
          (root / "post-release-verification.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

          receipt="$receipt_root/post-release-verification.json"
          bundle="${receipt}.sigstore.json"
          assets="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"
          receipt_exists=false
          bundle_exists=false
          grep -Fxq "$(basename "$receipt")" <<< "$assets" && receipt_exists=true
          grep -Fxq "$(basename "$bundle")" <<< "$assets" && bundle_exists=true
          if [ "$receipt_exists" != "$bundle_exists" ]; then
            echo "Existing post-release receipt assets are incomplete." >&2
            exit 1
          fi
          if [ "$receipt_exists" = true ]; then
            existing_root="$RUNNER_TEMP/existing-post-release-receipt"
            rm -rf "$existing_root"
            mkdir -p "$existing_root"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$(basename "$receipt")" \
              --pattern "$(basename "$bundle")" \
              --dir "$existing_root"
            test "$(sha256sum "$existing_root/$(basename "$receipt")" | awk '{print $1}')" = \
              "$(sha256sum "$receipt" | awk '{print $1}')"
            cp "$existing_root/$(basename "$bundle")" "$bundle"
          else
            if [ "${LEGACY_NORMAL_RECHECK:-false}" = true ]; then
              echo 'Legacy normal recheck requires the existing signed post-release receipt pair.' >&2
              exit 1
            fi
            cosign sign-blob --yes --bundle "$bundle" "$receipt"
            gh release upload "$RELEASE_TAG" "$receipt" "$bundle" \
              --repo "$GITHUB_REPOSITORY"
          fi

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-publish.yml@refs/heads/main"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" \
            --certificate-github-workflow-sha "$RELEASE_SHA" \
            "$receipt"
          verify_root="$RUNNER_TEMP/final-post-release-receipt"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$(basename "$receipt")" \
            --pattern "$(basename "$bundle")" \
            --dir "$verify_root"
          test "$(sha256sum "$verify_root/$(basename "$receipt")" | awk '{print $1}')" = \
            "$(sha256sum "$receipt" | awk '{print $1}')"
          cosign verify-blob \
            --bundle "$verify_root/$(basename "$bundle")" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" \
            --certificate-github-workflow-sha "$RELEASE_SHA" \
            "$verify_root/$(basename "$receipt")"

      - name: Mint exact consumer-scoped Security release token
        id: security-app
        if: >-
          (env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true') &&
          (env.SECURITY_RELEASE == 'true')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: container-ee-wunder-ansible-ubi9
          permission-actions: write

      - name: Dispatch immutable Security evidence after Producer acceptance
        if: >-
          (env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true') &&
          (env.SECURITY_RELEASE == 'true')
        env:
          APP_INSTALLATION_ID: ${{ steps.security-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.security-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.security-app.outputs.token }}
          PRODUCER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = lightning-it-release-automation
          test "$APP_INSTALLATION_ID" = 148019054
          actual_repositories="$(
            gh api --paginate 'installation/repositories?per_page=100' \
              | jq -sc '[.[].repositories[].full_name] | sort | unique'
          )"
          test "$actual_repositories" = \
            '["lightning-it/container-ee-wunder-ansible-ubi9"]'
          evidence=dist/release/security-release-evidence.json
          python scripts/generate-security-release-evidence.py verify \
            --metadata "$SECURITY_METADATA" \
            --profiles .lit/security-release-profiles.json \
            --source-sha "$RELEASE_SHA" \
            --artifact "dist/release/${CANDIDATE_NAME}" \
            --signature "dist/release/${CANDIDATE_NAME}.sigstore.json" \
            --sbom dist/release/sbom.cdx.json \
            --provenance dist/release/provenance.json \
            --evidence "$evidence"
          evidence_id="$(jq -er '.metadata.id' "$evidence")"
          release_state="$RUNNER_TEMP/security-release-before-dispatch.json"
          curl --fail --silent --show-error --location \
            --output "$release_state" \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${PRODUCER_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          revocation_count="$(
            jq --arg id "$evidence_id" '[.assets[].name | select(
              . == "security-release-revocation.json"
              or . == ("security-release-revocation-" + $id + ".json")
            )] | length' "$release_state"
          )"
          test "$revocation_count" -eq 0
          evidence_url="https://github.com/${GITHUB_REPOSITORY}/"
          evidence_url+="releases/download/${RELEASE_TAG}/$(basename "$evidence")"
          evidence_sha256="sha256:$(sha256sum "$evidence" | awk '{print $1}')"
          python scripts/dispatch-security-release.py \
            --evidence-url "$evidence_url" \
            --evidence-sha256 "$evidence_sha256"

      - name: Upload exact release attachment set
        if: >-
          always() &&
          (failure() || env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-attachments-${{ steps.source.outputs.sha }}
          path: |
            dist/release/
            dist/post-release/
            dist/validation/
          if-no-files-found: warn
          retention-days: 90

  modulix-validation-window-1:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lightning-it-release-automation[bot]' &&
      github.actor_id == '307565056' &&
      needs.publish.outputs.validation-required == 'true'
    name: Bound ModuLix validation window 1/6
    needs: [security-classification, release-validation, publish]
    uses: ./.github/workflows/modulix-validation-window.yml
    permissions:
      actions: read
      contents: read
    with:
      release_sha: ${{ inputs.release_sha }}
      release_version: ${{ needs.publish.outputs.release-version }}
      ci_run_id: ${{ needs.release-validation.outputs.ci-run-id }}
      ci_run_attempt: ${{ needs.release-validation.outputs.ci-run-attempt }}
      security_evidence_id: ${{ needs.security-classification.outputs.security-evidence-id }}
      handoff_sha256: ${{ needs.publish.outputs.handoff-sha256 }}
      controller_sha: ${{ needs.publish.outputs.controller-sha }}
      request_id: ${{ needs.publish.outputs.request-id }}
      prior_run_id: ${{ needs.publish.outputs.controller-run-id }}
      prior_run_attempt: ${{ needs.publish.outputs.controller-run-attempt }}
      wait_seconds: 2700
      final_window: false
      publish_runner: ${{ needs.security-classification.outputs.publish-runner }}
    secrets:
      release_automation_app_private_key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

  modulix-validation-window-2:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lightning-it-release-automation[bot]' &&
      github.actor_id == '307565056' &&
      needs.publish.outputs.validation-required == 'true'
    name: Bound ModuLix validation window 2/6
    needs: [security-classification, release-validation, publish, modulix-validation-window-1]
    uses: ./.github/workflows/modulix-validation-window.yml
    permissions:
      actions: read
      contents: read
    with:
