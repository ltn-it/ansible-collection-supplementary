          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(".normal-galaxy-response.json").read_text())
          artifact = payload.get("artifact") or {}
          if artifact.get("filename") != sys.argv[1]:
              raise SystemExit("Galaxy artifact filename mismatch")
          if artifact.get("sha256") != sys.argv[2]:
              raise SystemExit("Galaxy artifact digest mismatch")
          download_url = payload.get("download_url")
          if not isinstance(download_url, str) or not download_url.startswith("https://"):
              raise SystemExit("Galaxy download URL is missing or unsafe")
          print(download_url)
          ' "$CANDIDATE_NAME" "$candidate_sha")"

          curl --fail --location --silent --show-error \
            --output "$GITHUB_WORKSPACE/.normal-galaxy-artifact" "$galaxy_download_url"
          bash scripts/wunder-devtools-ee.sh cmp \
            .normal-galaxy-artifact "incoming/candidate/${CANDIDATE_NAME}"
          else
            # Preserved legacy and Security publication implementation.
