      - name: Create or verify GitHub Release and immutable assets
        if: env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${NORMAL_TWO_STAGE:-false}" = true ]; then
            # Normal release EE transport; no credentials enter the validator.
          set -euo pipefail

          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$current_main"
          test "$current_main" = "$RELEASE_SHA"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            release_state="$(
              gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json body,isDraft,isPrerelease,name,tagName
            )"
            jq -e --arg tag "$RELEASE_TAG" '
              .tagName == $tag
              and .name == $tag
              and .isDraft == false
              and .isPrerelease == false
            ' <<< "$release_state" >/dev/null
            release_state_path="$GITHUB_WORKSPACE/.normal-existing-release.json"
            printf '%s\n' "$release_state" > "$release_state_path"
