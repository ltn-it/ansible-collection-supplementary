# yamllint disable rule:truthy
---
name: Publish collection release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - galaxy.yml
      - CHANGELOG.rst
      - changelogs/changelog.yaml
  workflow_dispatch:
    inputs:
      create_github_release:
        description: Create the GitHub Release when repository policy enables it.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_galaxy:
        description: Publish to Galaxy when repository policy enables it.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      release_sha:
        description: Exact protected-main SHA to release; automated dispatch sets this.
        required: true
      reviewed_head_sha:
        description: Reviewed PR head parent for automated merge-integrity validation.
        required: true
      reviewed_base_sha:
        description: Reviewed PR base parent for automated merge-integrity validation.
        required: true
      security_evidence_id:
        description: Exact MLX-90 Evidence ID; release automation only.
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASE_VALIDATION_WORST_CASE_MINUTES: "530"
  RELEASE_VALIDATION_QUEUE_ALLOWANCE_MINUTES: "100"

jobs:
  dispatch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.pull_request.head.ref == 'develop' ||
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    name: Dispatch collection publish from main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Checkout protected Main dispatch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed merge and derive publishing settings
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          test "$MERGE_SHA" != "null"
          test "$MERGE_SHA" != ""
          test "$REVIEWED_HEAD_SHA" != ""
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

          main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          test "$main_sha" = "$MERGE_SHA"

          commit_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/commits/${MERGE_SHA}"
          )"
          mapfile -t parents < <(jq -r '.parents[].sha' <<< "$commit_json")
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$REVIEWED_HEAD_SHA"

          merged_galaxy="$GITHUB_WORKSPACE/.normal-merged-galaxy.yml"
          gh api "repos/${GITHUB_REPOSITORY}/contents/galaxy.yml?ref=${MERGE_SHA}" \
            --jq .content \
            | base64 --decode > "$merged_galaxy"
          release_version="$(bash scripts/wunder-devtools-ee.sh python3 -I -c '
          import sys
          import re
          from pathlib import Path

          match = re.search(
              r"(?m)^version:\s*[\"'"'"']?([^\s\"'"'"']+)",
              Path(sys.argv[1]).read_text(encoding="utf-8"),
          )
          if match is None:
              raise SystemExit("merged galaxy.yml has no version")
          print(match.group(1))
          ' /workspace/.normal-merged-galaxy.yml)"
          if ! [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Merged galaxy.yml does not contain a stable semantic version." >&2
            exit 1
          fi
          if [ "$HEAD_REF" = develop ]; then
            test "$PR_AUTHOR" = 'lightning-it-release-automation[bot]'
            test "$PR_AUTHOR_ID" = 307565056
            test "$PR_AUTHOR_TYPE" = Bot
            # Dispatch only locates work. The consumer independently proves both PRs.
            receipt_json="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/changelogs/release-preparation.json?ref=${MERGE_SHA}" \
                --jq .content | base64 --decode
            )"
            # Ordinary product promotions retain the published release state.
            # Compare the version, rather than all galaxy metadata, and the
            # exact generated blobs before classification or any App mint.
            parent_galaxy="$GITHUB_WORKSPACE/.normal-parent-galaxy.yml"
            gh api "repos/${GITHUB_REPOSITORY}/contents/galaxy.yml?ref=${parents[0]}" \
              --jq .content | base64 --decode >"$parent_galaxy"
            parent_version="$(bash scripts/wunder-devtools-ee.sh python3 -I -c '
          import sys
          import re
          from pathlib import Path

          versions = re.findall(
              r"(?m)^version:\s*[\"'"'"']?([^\s\"'"'"']+)[\"'"'"']?\s*$",
              Path(sys.argv[1]).read_text(encoding="utf-8"),
          )
          if len(versions) != 1:
              raise SystemExit("parent galaxy.yml must have exactly one version")
          print(versions[0])
          ' /workspace/.normal-parent-galaxy.yml)"
            release_state_changed=false
            if [ "$parent_version" != "$release_version" ]; then
              release_state_changed=true
            else
              for path in CHANGELOG.rst changelogs/.plugin-cache.yaml \
                  changelogs/changelog.yaml changelogs/release-preparation.json; do
                parent_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${parents[0]}" --jq .sha)"
                merged_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${MERGE_SHA}" --jq .sha)"
                test -n "$parent_blob" && test "$parent_blob" != null
                test -n "$merged_blob" && test "$merged_blob" != null
                if [ "$parent_blob" != "$merged_blob" ]; then
                  release_state_changed=true
                fi
              done
            fi
            if [ "$release_state_changed" = false ]; then
              echo 'Main promotion preserves release state; no publication needed.'
              echo 'release_needed=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            jq -e --arg version "$release_version" '
              .schema_version == 3 and .release_mode == "normal" and .next_version == $version
            ' <<<"$receipt_json" >/dev/null
          else
            test "$HEAD_REF" = "release/v${release_version}"
          fi

          create_github_release=true
          publish_galaxy=true
          if [[ "$PR_BODY" == *"GitHub release creation: \`false\`"* ]]; then
            create_github_release=false
          fi
          if [[ "$PR_BODY" == *"Galaxy publishing: \`false\`"* ]]; then
            publish_galaxy=false
          fi

          if [ "$HEAD_REF" = develop ]; then
            create_github_release="$(jq -er '.publication.github_release | tostring' <<<"$receipt_json")"
            publish_galaxy="$(jq -er '.publication.galaxy | tostring' <<<"$receipt_json")"
            [[ "$create_github_release" = true || "$create_github_release" = false ]]
            [[ "$publish_galaxy" = true || "$publish_galaxy" = false ]]
          fi
          {
            echo "release_needed=true"
            echo "release_version=$release_version"
            echo "release_sha=$MERGE_SHA"
            echo "reviewed_head_sha=$REVIEWED_HEAD_SHA"
            echo "reviewed_base_sha=${parents[0]}"
            echo "create_github_release=$create_github_release"
            echo "publish_galaxy=$publish_galaxy"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact merge for Security classification
        if: steps.release.outputs.release_needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable pre-consumption Security binding
        if: steps.release.outputs.release_needed == 'true'
        id: binding
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          receipt=changelogs/release-preparation.json
          test -f "$receipt"
          test ! -L "$receipt"
          base_sha="$(
            jq -er --arg version "$RELEASE_VERSION" '
              select(.next_version == $version)
              | .base_sha
              | select(test("^[0-9a-f]{40}$"))
            ' "$receipt"
          )"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"

      - name: Checkout immutable pre-consumption Security binding
        if: steps.release.outputs.release_needed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.binding.outputs.base_sha }}
          path: security-binding-base
          persist-credentials: false

      - name: Classify evidence-bound release version
        if: steps.release.outputs.release_needed == 'true'
        id: security
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          classification="$(bash scripts/wunder-devtools-ee.sh python3 -B scripts/classify-security-release.py \
            --event-kind version --version "$RELEASE_VERSION" --binding-root security-binding-base --github-output '')"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$classification" >>"$GITHUB_OUTPUT"

      - name: Mint exact publish-dispatch App token
        if: steps.release.outputs.release_needed == 'true'
        id: publish-dispatch-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Dispatch exact-SHA publish workflow on main
        if: steps.release.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ steps.publish-dispatch-app.outputs.token }}
          CREATE_GITHUB_RELEASE: ${{ steps.release.outputs.create_github_release }}
          PUBLISH_GALAXY: ${{ steps.release.outputs.publish_galaxy }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          REVIEWED_HEAD_SHA: ${{ steps.release.outputs.reviewed_head_sha }}
          REVIEWED_BASE_SHA: ${{ steps.release.outputs.reviewed_base_sha }}
          SECURITY_EVIDENCE_ID: ${{ steps.security.outputs.security_evidence_id }}
        run: |
          set -euo pipefail

          gh workflow run collection-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f create_github_release="$CREATE_GITHUB_RELEASE" \
            -f publish_galaxy="$PUBLISH_GALAXY" \
            -f release_sha="$RELEASE_SHA" \
            -f reviewed_head_sha="$REVIEWED_HEAD_SHA" \
            -f reviewed_base_sha="$REVIEWED_BASE_SHA" \
            -f security_evidence_id="$SECURITY_EVIDENCE_ID"

  security-classification:
    name: Classify exact publish request
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish-runner: ${{ steps.runner.outputs.labels }}
      security-release: ${{ steps.classify.outputs.security_release }}
      security-evidence-id: ${{ steps.classify.outputs.security_evidence_id }}
      security-version: ${{ steps.classify.outputs.security_version }}
    steps:
      - name: Checkout requested protected-main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable pre-consumption Security binding
        id: binding
        env:
          EVIDENCE_ID: ${{ inputs.security_evidence_id || '' }}
        run: |
          set -euo pipefail
          receipt=changelogs/release-preparation.json
          test -f "$receipt"
          test ! -L "$receipt"
          base_sha="$(
            jq -er --arg evidence_id "$EVIDENCE_ID" '
              select(
                ($evidence_id == "" or .security.evidence_id == $evidence_id)
              )
              | .base_sha
              | select(test("^[0-9a-f]{40}$"))
            ' "$receipt"
          )"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
      - name: Checkout immutable pre-consumption Security binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.binding.outputs.base_sha }}
          path: security-binding-base
          persist-credentials: false
      - name: Verify main identity and classify before environment selection
        id: classify
        env:
          EVIDENCE_ID: ${{ inputs.security_evidence_id || '' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_SHA"
          release_version="$(bash scripts/wunder-devtools-ee.sh python3 -I -c '
          import re
          from pathlib import Path
          match = re.search(
              r"(?m)^version:\s*[\"'"'"']?([^\s\"'"'"']+)",
              Path("galaxy.yml").read_text(encoding="utf-8"),
          )
          if match is None:
              raise SystemExit("galaxy.yml has no version")
          print(match.group(1))
          ')"
          classification="$(bash scripts/wunder-devtools-ee.sh python3 -B scripts/classify-security-release.py \
            --event-kind version \
            --version "$release_version" \
            --evidence-id "$EVIDENCE_ID" \
            --binding-root security-binding-base --github-output '')"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$classification" >>"$GITHUB_OUTPUT"
      - name: Select the immutable publication runner class
        id: runner
        env:
          SECURITY_RELEASE: ${{ steps.classify.outputs.security_release }}
        run: |
          set -euo pipefail
          case "$SECURITY_RELEASE" in
            true)
              echo 'labels=["self-hosted","linux","x64","incus"]' >> "$GITHUB_OUTPUT"
              ;;
            false)
              echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Security classification did not return a canonical boolean." >&2
              exit 1
              ;;
          esac

  release-validation-window:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 1/8
    needs: security-classification
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false

  release-validation-window-2:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 2/8
    needs: release-validation-window
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window.outputs.complete }}

  release-validation-window-3:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 3/8
    needs: release-validation-window-2
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window-2.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-2.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-2.outputs.complete }}

  release-validation-window-4:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 4/8
    needs: release-validation-window-3
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window-3.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-3.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-3.outputs.complete }}

  release-validation-window-5:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 5/8
    needs: release-validation-window-4
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window-4.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-4.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-4.outputs.complete }}

  release-validation-window-6:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 6/8
    needs: release-validation-window-5
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window-5.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-5.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-5.outputs.complete }}

  release-validation-window-7:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Exact-SHA Collection CI window 7/8
    needs: release-validation-window-6
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 160
      final_window: false
      prior_run_id: ${{ needs.release-validation-window-6.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-6.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-6.outputs.complete }}

  release-validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    name: Verify exact-SHA Release Validation within final window
    needs: release-validation-window-7
    uses: ./.github/workflows/release-validation-window.yml
    permissions:
      actions: read
    with:
      release_sha: ${{ inputs.release_sha }}
      attempts: 140
      final_window: true
      prior_run_id: ${{ needs.release-validation-window-7.outputs.ci-run-id }}
      prior_run_attempt: ${{ needs.release-validation-window-7.outputs.ci-run-attempt }}
      prior_complete: ${{ needs.release-validation-window-7.outputs.complete }}

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (needs.security-classification.outputs.security-release == 'false' ||
       (needs.security-classification.outputs.security-release == 'true' &&
        github.actor == 'lightning-it-release-automation[bot]' &&
        github.actor_id == '307565056'))
    name: Stage or publish collection release
    needs: [security-classification, release-validation]
    runs-on: ${{ fromJSON(needs.security-classification.outputs.publish-runner) }}
    timeout-minutes: 90
    environment:
      name: >-
        ${{ needs.security-classification.outputs.security-release == 'true' &&
            github.actor == 'lightning-it-release-automation[bot]' &&
            github.actor_id == '307565056' &&
            'mlx90-security-publish' ||
            'ansible-collections' }}
    concurrency:
      group: collection-release-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    outputs:
      handoff-sha256: ${{ steps.release-handoff.outputs.sha256 }}
      handoff-artifact-id: ${{ steps.upload-release-stage.outputs.artifact-id }}
      validation-required: ${{ steps.release-handoff.outputs.validation-required }}
      release-version: ${{ steps.release-handoff.outputs.release-version }}
      controller-sha: ${{ steps.modulix-dispatch.outputs.controller-sha }}
      request-id: ${{ steps.modulix-dispatch.outputs.request-id }}
      controller-run-id: ${{ steps.modulix-dispatch.outputs.controller-run-id }}
      controller-run-attempt: ${{ steps.modulix-dispatch.outputs.controller-run-attempt }}
    env:
      CI_RUN_ID: ${{ needs.release-validation.outputs.ci-run-id }}
      CI_RUN_ATTEMPT: ${{ needs.release-validation.outputs.ci-run-attempt }}

    steps:
      - name: Enforce dedicated release-tag principal configuration
        env:
          RELEASE_TAG_APP_ID: ${{ vars.RELEASE_TAG_APP_ID }}
          RELEASE_TAG_APP_CLIENT_ID: ${{ vars.RELEASE_TAG_APP_CLIENT_ID }}
          RELEASE_TAG_APP_INSTALLATION_ID: ${{ vars.RELEASE_TAG_APP_INSTALLATION_ID }}
          RELEASE_TAG_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TAG_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG_APP_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RELEASE_TAG_APP_ID" != 15368
          test -n "$RELEASE_TAG_APP_CLIENT_ID"
          [[ "$RELEASE_TAG_APP_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$RELEASE_TAG_APP_PRIVATE_KEY"
          case "$RELEASE_TAG_APP_PRIVATE_KEY" in
            *'BEGIN PRIVATE KEY'*|*'BEGIN RSA PRIVATE KEY'*) ;;
            *) echo "::error::Dedicated release-tag App private key is malformed."; exit 1 ;;
          esac

      - name: Resolve exact protected-main release SHA
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          release_sha="$REQUESTED_SHA"
          if ! [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $release_sha" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected-main and reviewed merge identity
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REVIEWED_BASE_SHA: ${{ inputs.reviewed_base_sha }}
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main"
          test "$remote_main" = "$RELEASE_SHA"
          test "$REVIEWED_HEAD_SHA" != ""
          test "$REVIEWED_BASE_SHA" != ""
          test "$REVIEWED_HEAD_SHA" != "$RELEASE_SHA"
          test "$REVIEWED_BASE_SHA" != "$RELEASE_SHA"
          mapfile -t parents < <(git show -s --format='%P' "$RELEASE_SHA" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$REVIEWED_BASE_SHA"
          test "${parents[1]}" = "$REVIEWED_HEAD_SHA"
          git diff --quiet "$REVIEWED_HEAD_SHA" "$RELEASE_SHA" -- .

          if [ "$(jq -er '.schema_version' changelogs/release-preparation.json)" = 3 ]; then
            test "$(jq -er '.release_mode' changelogs/release-preparation.json)" = normal
            echo 'NORMAL_TWO_STAGE=true' >>"$GITHUB_ENV"
            exit 0  # The native two-stage proof below owns this route.
          fi

          if [ "$(jq -er '.release_mode' changelogs/release-preparation.json)" = normal ]; then
            # Schema 2 is historical read/recheck compatibility, never a new normal release.
            legacy_version="$(jq -er '.next_version' changelogs/release-preparation.json)"
            [[ "$legacy_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            legacy_tag="v${legacy_version}"
            git fetch --no-tags origin "refs/tags/${legacy_tag}"
            test "$(git cat-file -t FETCH_HEAD)" = tag
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
            published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${legacy_tag}")"
            # target_commitish may be a historical Develop tag-creation hint.
            # The live immutable tag above binds the actual release target.
            jq -e --arg tag "$legacy_tag" '
              .tag_name == $tag and .draft == false and .prerelease == false
              and (.id | type == "number") and .id > 0
              and (.published_at | type == "string" and length > 0)
            ' <<<"$published" >/dev/null
            echo 'LEGACY_NORMAL_RECHECK=true' >>"$GITHUB_ENV"
          fi

          mapfile -t preparation_parents < <(
            git show -s --format='%P' "$REVIEWED_HEAD_SHA" | tr ' ' '\n'
          )
          test "${#preparation_parents[@]}" -eq 1
          test "${preparation_parents[0]}" = "$REVIEWED_BASE_SHA"
          expected_identity='lightning-it-release-automation[bot]'
          expected_identity+=' <307565056+lightning-it-release-automation[bot]@users.noreply.github.com>'
          test "$(git show -s --format='%an <%ae>' "$REVIEWED_HEAD_SHA")" = \
            "$expected_identity"
          test "$(git show -s --format='%cn <%ce>' "$REVIEWED_HEAD_SHA")" = \
            "$expected_identity"
          test -s changelogs/release-preparation.json
          if git diff --quiet \
              "$REVIEWED_BASE_SHA" "$REVIEWED_HEAD_SHA" -- \
              changelogs/release-preparation.json
          then
            echo "Release preparation receipt was not created by the reviewed commit." >&2
            exit 1
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              galaxy.yml|CHANGELOG.rst|changelogs/changelog.yaml|\
              changelogs/.plugin-cache.yaml|changelogs/release-preparation.json|\
              changelogs/fragments/*.yml|changelogs/fragments/*.yaml) ;;
              *)
                echo "Unauthorized release-preparation path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(
            git diff --name-only "$REVIEWED_BASE_SHA" "$REVIEWED_HEAD_SHA"
          )

          associated_prs="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls"
          )"
          release_version="$(
            python - <<'PY'
          import re
          from pathlib import Path

          match = re.search(
              r"(?m)^version:\s*[\"']?([^\s\"']+)",
              Path("galaxy.yml").read_text(encoding="utf-8"),
          )
          if match is None:
              raise SystemExit("galaxy.yml has no version")
          print(match.group(1))
          PY
          )"
          expected_head="release/v${release_version}"
          test "$(git show -s --format='%s' "$REVIEWED_HEAD_SHA")" = \
            "chore(release): prepare v${release_version}"
          release_pr_count="$(
            jq \
              --arg sha "$RELEASE_SHA" \
              --arg head "$REVIEWED_HEAD_SHA" \
              --arg head_ref "$expected_head" \
              --arg repo "$GITHUB_REPOSITORY" '[
              .[]
              | select(
                  .merged_at != null
                  and .merge_commit_sha == $sha
                  and .base.ref == "main"
                  and .head.ref == $head_ref
                  and .head.sha == $head
                  and .head.repo.full_name == $repo
                )
            ] | length' <<< "$associated_prs"
          )"
          test "$release_pr_count" -eq 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install exact release validation tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            ansible-core==2.18.18 \
            PyYAML==6.0.3

      - name: Checkout immutable public native-control verifier
        if: env.NORMAL_TWO_STAGE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: lightning-it/.github
          ref: bb1a5df9f54c5f98547048297e7e367cc382543e
          path: release-control-source
          persist-credentials: false

      - name: Prove normal preparation ingress and exact approved promotion
        if: env.NORMAL_TWO_STAGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
          REVIEWED_BASE_SHA: ${{ inputs.reviewed_base_sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          observations="$GITHUB_WORKSPACE/.normal-native-observations"
          fresh="$GITHUB_WORKSPACE/.normal-native-fresh"
          bash scripts/normal_release_observations.sh publication \
            "$observations" "$GITHUB_REPOSITORY" "$RELEASE_SHA"
          mkdir "$RUNNER_TEMP/normal-release-ee-output"
          # Live native proof is offline. Existing archive replay additionally
          # needs only standard Sigstore trust-root retrieval, without credentials.
          verifier_network=none
          if [ "$(jq '.assets | length' "$observations/index.json")" -gt 0 ]; then
            verifier_network=bridge
          fi
          WUNDER_DEVTOOLS_NETWORK="$verifier_network" bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            unset GIT_DIR GIT_COMMON_DIR GIT_WORK_TREE
            git -c safe.directory=/workspace clone --quiet --no-hardlinks --no-checkout /workspace "$HOME/release"
            git -C "$HOME/release" checkout --quiet --detach "$1"
            cp -a --no-preserve=ownership /workspace/release-control-source "$HOME/control"
            mkdir "$HOME/output"
            test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
            python3 -B /workspace/scripts/normal_release_proof.py publish \
              --root "$HOME/release" --control-root "$HOME/control" \
              --repository "$2" --repository-id "$3" --release "$1" --base "$4" --head "$5" \
              --archive-directory "$HOME/output/normal-release-native" \
              --observation-directory /workspace/.normal-native-observations >"$HOME/output/proof.json"
            tar -C "$HOME/output" -cf - proof.json normal-release-native
          ' normal-native-proof "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$REPOSITORY_ID" \
            "$REVIEWED_BASE_SHA" "$REVIEWED_HEAD_SHA" | tar -xf - -C "$RUNNER_TEMP/normal-release-ee-output"
          bash scripts/normal_release_observations.sh fresh \
            "$fresh" "$GITHUB_REPOSITORY" "$RELEASE_SHA" "$observations"
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            cp -a --no-preserve=ownership /workspace/release-control-source "$HOME/control"
            python3 -B /workspace/scripts/normal_release_proof.py freshness \
              --root /workspace --base "$1" --control-root "$HOME/control" \
              --repository "$2" --repository-id "$3" \
              --observation-directory /workspace/.normal-native-observations \
              --fresh-observation-directory /workspace/.normal-native-fresh
          ' normal-native-freshness "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$REPOSITORY_ID"
          proof="$RUNNER_TEMP/normal-release-ee-output/proof.json"
          mv "$RUNNER_TEMP/normal-release-ee-output/normal-release-native" "$RUNNER_TEMP/normal-release-native"
          {
            echo "PREPARATION_BASE_SHA=$(jq -er '.content_base' "$proof")"
            echo "PREPARATION_HEAD_SHA=$(jq -er '.prepared_head' "$proof")"
            echo "NORMAL_NATIVE_ARCHIVE_REUSED=$(jq -er '.archive_reused | tostring' "$proof")"
          } >>"$GITHUB_ENV"

      - name: Re-prove fragment-derived version and authorized preparation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REVIEWED_HEAD_SHA: ${{ env.PREPARATION_HEAD_SHA || inputs.reviewed_head_sha }}
          REVIEWED_BASE_SHA: ${{ env.PREPARATION_BASE_SHA || inputs.reviewed_base_sha }}
        run: |
          set -euo pipefail

          operation="$GITHUB_WORKSPACE/.normal-version-validation.sh"
          trap 'rm -f -- "$operation" "$GITHUB_WORKSPACE/.normal-preparation-run.json"' EXIT
          cat >"$operation" <<'VERIFY_VERSION'
          receipt=changelogs/release-preparation.json
          expected_version="$(jq -er '.next_version' "$receipt")"
          release_mode="$(jq -er '.release_mode' "$receipt")"
          released_version="$(python - <<'PY'
          from pathlib import Path
          import yaml

          payload = yaml.safe_load(Path("galaxy.yml").read_text(encoding="utf-8"))
          print(payload["version"])
          PY
          )"
          test "$released_version" = "$expected_version"

          base_tree="$RUNNER_TEMP/release-preparation-base"
          test ! -e "$base_tree"
          git worktree add --detach --quiet "$base_tree" "$REVIEWED_BASE_SHA"
          test "$(git -C "$base_tree" rev-parse HEAD)" = "$REVIEWED_BASE_SHA"
          workflow_source="$(jq -er '.workflow.source_sha' "$receipt")"
          workflow_tree="$base_tree"
          if [ "${NORMAL_TWO_STAGE:-false}" = true ]; then
            workflow_tree="$RUNNER_TEMP/release-preparation-workflow-source"
            test ! -e "$workflow_tree"
            git worktree add --detach --quiet "$workflow_tree" "$workflow_source"
          fi
          python "$workflow_tree/scripts/release-version.py" \
            --verify-preparation-receipt "$receipt" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --base-sha "$REVIEWED_BASE_SHA" \
            --expected-version "$expected_version" \
            --root "$base_tree" >/dev/null

          while IFS= read -r fragment; do
            name="$(jq -er '.path' <<< "$fragment")"
            expected_digest="$(jq -er '.sha256' <<< "$fragment")"
            fragment_path="$base_tree/changelogs/fragments/$name"
            test -f "$fragment_path"
            test ! -L "$fragment_path"
            test "$(sha256sum "$fragment_path" | awk '{print $1}')" = \
              "$expected_digest"
            if git cat-file -e \
                "$REVIEWED_HEAD_SHA:changelogs/fragments/$name" 2>/dev/null
            then
              echo "Reviewed fragment was not consumed: $name" >&2
              exit 1
            fi
          done < <(jq -c '.fragments[]' "$receipt")

          version_args=()
          case "$release_mode" in
            security)
              version_args=(
                --security-target-version "$expected_version"
                --root "$base_tree"
              )
              ;;
            normal)
              version_args=(--requested-version "$expected_version")
              ;;
            *)
              echo "Unsupported preparation release mode: $release_mode" >&2
              exit 1
              ;;
          esac
          recomputed="$(
            python "$workflow_tree/scripts/release-version.py" \
              --galaxy "$base_tree/galaxy.yml" \
              --fragments "$base_tree/changelogs/fragments" \
              "${version_args[@]}"
          )"
          jq -e --argjson recomputed "$recomputed" '
            .current_version == $recomputed.current_version
            and .impact == $recomputed.impact
            and .next_version == $recomputed.version
            and .fragments == $recomputed.fragment_sha256
          ' "$receipt" >/dev/null

          VERIFY_VERSION
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            unset GIT_DIR GIT_COMMON_DIR GIT_WORK_TREE
            git -c safe.directory=/workspace clone --quiet --no-hardlinks --no-checkout /workspace "$HOME/release"
            git -C "$HOME/release" checkout --quiet --detach "$1"
            mkdir "$HOME/validation"
            export RUNNER_TEMP="$HOME/validation" GITHUB_WORKSPACE="$HOME/release"
            export GITHUB_REPOSITORY="$2" REPOSITORY_ID="$3" REVIEWED_BASE_SHA="$4" REVIEWED_HEAD_SHA="$5"
            export NORMAL_TWO_STAGE="$6"
            cd "$HOME/release"
            source /workspace/.normal-version-validation.sh
          ' verify-release-version "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$REPOSITORY_ID" \
            "$REVIEWED_BASE_SHA" "$REVIEWED_HEAD_SHA" "${NORMAL_TWO_STAGE:-false}"
          receipt=changelogs/release-preparation.json
          workflow_source="$(jq -er '.workflow.source_sha' "$receipt")"
          preparation_run_id="$(jq -er '.workflow.run_id' "$receipt")"
          preparation_attempt="$(jq -er '.workflow.run_attempt' "$receipt")"
          preparation_actor="$(jq -er '.workflow.actor' "$receipt")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${preparation_run_id}" \
            >"$GITHUB_WORKSPACE/.normal-preparation-run.json"
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
          jq -e \
            --arg repository "$1" \
            --arg base_sha "$2" \
            --arg run_id "$3" \
            --arg run_attempt "$4" \
            --arg actor "$5" '"'"'
            (.id | tostring) == $run_id
            and (.run_attempt | tostring) == $run_attempt
            and .repository.full_name == $repository
            and .head_repository.full_name == $repository
            and .head_sha == $base_sha
            and .head_branch == "main"
            and (.event == "push" or .event == "workflow_dispatch")
            and .path == ".github/workflows/release-prepare.yml"
            and .actor.login == $actor
            and .status == "completed"
            and .conclusion == "success"
          '"'"' "/workspace/.normal-preparation-run.json" >/dev/null
          ' verify-preparation-producer "$GITHUB_REPOSITORY" "$workflow_source" \
            "$preparation_run_id" "$preparation_attempt" "$preparation_actor"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download exact candidate and evidence from validated run
        env:
          CI_RUN_ID: ${{ needs.release-validation.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ needs.release-validation.outputs.ci-run-attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-ci-run.sh "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
          mkdir -p incoming/candidate incoming/evidence
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "collection-candidate-${RELEASE_SHA}" \
            --dir incoming/candidate
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "collection-release-evidence-${RELEASE_SHA}" \
            --dir incoming/evidence
          bash scripts/verify-release-ci-run.sh "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"

      - name: Validate candidate, MANIFEST, evidence, and repository policy
        env:
          CI_RUN_ID: ${{ needs.release-validation.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ needs.release-validation.outputs.ci-run-attempt }}
          REQUEST_CREATE_GITHUB_RELEASE: ${{ inputs.create_github_release }}
          REQUEST_PUBLISH_GALAXY: ${{ inputs.publish_galaxy }}
        run: |
          set -euo pipefail
          operation="$GITHUB_WORKSPACE/.normal-candidate-validation.sh"
          trap 'rm -f -- "$operation"' EXIT
          cat >"$operation" <<'VALIDATE_CANDIDATE'
          set -euo pipefail

          mapfile -t candidates < <(
            find incoming/candidate -maxdepth 1 -type f \
              -name 'lit-supplementary-*.tar.gz' -print
          )
          test "${#candidates[@]}" -eq 1
          candidate="${candidates[0]}"
          (
            cd incoming/candidate
            test -s candidate-SHA256SUMS
            sha256sum --check candidate-SHA256SUMS
          )
          (
            cd incoming/evidence/release-assets
            test -s SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          python scripts/quality_evidence.py validate \
            --root incoming/evidence/evidence \
            --release \
            --expected-commit "$RELEASE_SHA"

          CANDIDATE="$candidate" python - <<'PY'
          import json
          import os
          import re
          import tarfile
          from pathlib import Path
          from pathlib import PurePosixPath

          import yaml

          candidate = Path(os.environ["CANDIDATE"])
          galaxy = yaml.safe_load(Path("galaxy.yml").read_text(encoding="utf-8")) or {}
          policy = yaml.safe_load(Path(".lit/repository.yml").read_text(encoding="utf-8")) or {}
          compressed_bytes = candidate.stat().st_size
          if compressed_bytes <= 0:
              raise SystemExit("candidate archive is empty")
          with tarfile.open(candidate, "r:gz") as stream:
              members = stream.getmembers()
              if len(members) > 20_000:
                  raise SystemExit("candidate archive has too many members")
              seen: set[str] = set()
              total_bytes = 0
              manifest_member = None
              for member in members:
                  path = PurePosixPath(member.name)
                  normalized = path.as_posix()
                  if path.is_absolute() or ".." in path.parts or normalized in {"", "."}:
                      raise SystemExit(f"unsafe candidate member path: {member.name}")
                  if normalized in seen:
                      raise SystemExit(f"duplicate candidate member path: {normalized}")
                  seen.add(normalized)
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsafe candidate member type: {member.name}")
                  if member.size > 512 * 1024 * 1024:
                      raise SystemExit(f"oversized candidate member: {member.name}")
                  total_bytes += member.size
                  if total_bytes > 2 * 1024 * 1024 * 1024:
                      raise SystemExit("candidate expands beyond size limit")
                  if normalized == "MANIFEST.json":
                      manifest_member = member
              if total_bytes > compressed_bytes * 1_000:
                  raise SystemExit("candidate compression ratio exceeds limit")
              if manifest_member is None or not manifest_member.isfile():
                  raise SystemExit("candidate has no regular MANIFEST.json")
              manifest_file = stream.extractfile(manifest_member)
              if manifest_file is None:
                  raise SystemExit("candidate MANIFEST.json cannot be read")
              archive_manifest = json.loads(manifest_file.read().decode("utf-8"))
          evidence_manifest = json.loads(
              Path("incoming/evidence/evidence/manifest.json").read_text(encoding="utf-8")
          )
          publication = json.loads(
              Path("incoming/evidence/release-assets/release-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          security_receipt = json.loads(
              Path(
                  "incoming/evidence/release-assets/release-security-receipt.json"
              ).read_text(encoding="utf-8")
          )

          namespace = str(galaxy.get("namespace", ""))
          name = str(galaxy.get("name", ""))
          version = str(galaxy.get("version", ""))
          if namespace != "lit" or name != "supplementary":
              raise SystemExit("unexpected collection identity in galaxy.yml")
          if re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) is None:
              raise SystemExit(f"invalid collection version: {version!r}")

          info = archive_manifest.get("collection_info", {})
          expected_filename = f"{namespace}-{name}-{version}.tar.gz"
          if candidate.name != expected_filename:
              raise SystemExit(f"unexpected candidate filename: {candidate.name}")
          if (
              info.get("namespace") != namespace
              or info.get("name") != name
              or str(info.get("version")) != version
          ):
              raise SystemExit("candidate MANIFEST identity/version mismatch")

          release_sha = os.environ["RELEASE_SHA"]
          if evidence_manifest.get("commit_sha") != release_sha:
              raise SystemExit("evidence commit does not match release SHA")
          if str(evidence_manifest.get("workflow_run_id")) != os.environ["CI_RUN_ID"]:
              raise SystemExit("evidence workflow run does not match selected CI run")
          if str(evidence_manifest.get("workflow_attempt")) != os.environ["CI_RUN_ATTEMPT"]:
              raise SystemExit("evidence workflow attempt does not match selected CI attempt")
          if evidence_manifest.get("release_eligible") is not True:
              raise SystemExit("release evidence is not eligible")
          if publication.get("commit_sha") != release_sha:
              raise SystemExit("publication eligibility commit does not match release SHA")
          if str(publication.get("workflow_run_id")) != os.environ["CI_RUN_ID"]:
              raise SystemExit("publication eligibility workflow does not match selected CI run")
          if str(publication.get("workflow_attempt")) != os.environ["CI_RUN_ATTEMPT"]:
              raise SystemExit("publication eligibility attempt does not match selected CI attempt")
          if publication.get("release_eligible") is not True:
              raise SystemExit("publication eligibility is false")
          publication_gates = publication.get("gates")
          if (
              not isinstance(publication_gates, dict)
              or not publication_gates
              or not all(publication_gates.values())
          ):
              raise SystemExit("publication eligibility contains an unsatisfied gate")
          if security_receipt.get("commit_sha") != release_sha:
              raise SystemExit("release-security receipt commit does not match release SHA")
          if str(security_receipt.get("workflow_run_id")) != os.environ["CI_RUN_ID"]:
              raise SystemExit("release-security receipt workflow does not match selected CI run")
          if str(security_receipt.get("workflow_attempt")) != os.environ["CI_RUN_ATTEMPT"]:
              raise SystemExit("release-security receipt attempt does not match selected CI attempt")
          if security_receipt.get("release_eligible") is not True:
              raise SystemExit("release-security receipt is not eligible")
          receipt_gates = security_receipt.get("gates")
          if (
              not isinstance(receipt_gates, dict)
              or not receipt_gates
              or not all(receipt_gates.values())
          ):
              raise SystemExit("release-security receipt contains an unsatisfied gate")
          long_term = security_receipt.get("long_term_archive") or {}
          archive = Path(
              f"incoming/evidence/long-term/collection-release-evidence-{release_sha}.tar.gz"
          )
          if not archive.is_file():
              raise SystemExit("complete long-term release-evidence bundle is missing")
          import hashlib

          if hashlib.sha256(archive.read_bytes()).hexdigest() != long_term.get("sha256"):
              raise SystemExit("long-term release-evidence bundle digest mismatch")

          targets = set(policy.get("publishing_targets") or [])
          github_required = "github-release" in targets
          galaxy_required = bool(policy.get("galaxy_publish")) and "ansible-galaxy" in targets
          if not github_required:
              raise SystemExit(".lit policy must enable the mandatory GitHub Release target")

          output = Path(os.environ["GITHUB_ENV"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"RELEASE_VERSION={version}\n")
              stream.write(f"RELEASE_TAG=v{version}\n")
              stream.write(f"CANDIDATE_NAME={candidate.name}\n")
              stream.write(f"GALAXY_REQUIRED={str(galaxy_required).lower()}\n")

          if os.environ.get("REQUEST_CREATE_GITHUB_RELEASE") == "false":
              print("Repository policy overrides the advisory GitHub Release input.")
          if galaxy_required and os.environ.get("REQUEST_PUBLISH_GALAXY") == "false":
              print("Repository policy overrides the advisory Galaxy input.")
          PY

          test -s "incoming/evidence/release-assets/collection-evidence-${RELEASE_SHA}.tar.gz"
          test -s incoming/evidence/release-assets/sbom.cdx.json
          test -s incoming/evidence/release-assets/provenance.json
          test -s incoming/evidence/release-assets/SHA256SUMS.sigstore.json
          test -s incoming/evidence/release-assets/release-security-receipt.json.sigstore.json
          test -s incoming/evidence/evidence/security/vulnerability-report.json
          test -s incoming/evidence/evidence/security/trivy-vulnerability-report.json
          test -s incoming/evidence/evidence/security/secret-scan-summary.json
          (
            cd incoming/evidence/long-term
            sha256sum --check "collection-release-evidence-${RELEASE_SHA}.tar.gz.sha256"
          )
          VALIDATE_CANDIDATE
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            export CI_RUN_ID="$1" CI_RUN_ATTEMPT="$2" RELEASE_SHA="$3" GITHUB_REPOSITORY="$4"
            export REQUEST_CREATE_GITHUB_RELEASE="$5" REQUEST_PUBLISH_GALAXY="$6"
            export GITHUB_ENV="$HOME/release-environment"
            source /workspace/.normal-candidate-validation.sh >&2
            cat "$GITHUB_ENV"
          ' candidate-validation "$CI_RUN_ID" "$CI_RUN_ATTEMPT" "$RELEASE_SHA" "$GITHUB_REPOSITORY" \
            "$REQUEST_CREATE_GITHUB_RELEASE" "$REQUEST_PUBLISH_GALAXY" >>"$GITHUB_ENV"
      - name: Classify exact-SHA Security release metadata
        run: |
          set -euo pipefail
          profiles=.lit/security-release-profiles.json
          metadata=".lit/security-releases/${RELEASE_VERSION}.json"
          test -s "$profiles"
          test ! -L "$profiles"
          if [ -L "$metadata" ]; then
            echo "Security release metadata must not be a symlink: $metadata" >&2
            exit 1
          fi
          if [ -e "$metadata" ]; then
            test -f "$metadata"
            test -s "$metadata"
            echo "SECURITY_RELEASE=true" >> "$GITHUB_ENV"
            echo "SECURITY_METADATA=$metadata" >> "$GITHUB_ENV"
          else
            echo "SECURITY_RELEASE=false" >> "$GITHUB_ENV"
            echo "SECURITY_METADATA=" >> "$GITHUB_ENV"
            echo "No exact-version Security metadata; retaining transition-only release semantics."
          fi

      - name: Install exact candidate in a clean collection path
        run: |
          WUNDER_DEVTOOLS_NETWORK=bridge bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
          set -euo pipefail
          install_root="$HOME/candidate-install"
          rm -rf "$install_root"
          ansible-galaxy collection install \
            "incoming/candidate/$1" \
            -p "$install_root" \
            --force
          ANSIBLE_COLLECTIONS_PATH="$install_root" \
            ansible-doc --type role lit.supplementary.keycloak_deploy >/dev/null
          installed_playbook="$install_root/ansible_collections/lit/supplementary/playbooks/example.yml"
          test -s "$installed_playbook"
          ANSIBLE_COLLECTIONS_PATH="$install_root" \
            ansible-playbook --syntax-check "$installed_playbook"

          ' collection-install "$CANDIDATE_NAME" "$RELEASE_VERSION"
      - name: Verify signatures and attestations; download attestation bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          sbom_check="$GITHUB_WORKSPACE/.normal-sbom-validation.py"
          trap 'rm -f -- "$sbom_check"' EXIT
          cat >"$sbom_check" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate = Path(os.environ["CANDIDATE"])
          candidate_sha = hashlib.sha256(candidate.read_bytes()).hexdigest()
          sbom = json.loads(
              Path("incoming/evidence/release-assets/sbom.cdx.json").read_text(
                  encoding="utf-8"
              )
          )
          component = ((sbom.get("metadata") or {}).get("component") or {})
          expected_component = {
              "group": "lit",
              "name": "supplementary",
              "version": os.environ["RELEASE_VERSION"],
          }
          if any(component.get(key) != value for key, value in expected_component.items()):
              raise SystemExit("SBOM component does not match the collection release")
          if component.get("purl") != (
              f"pkg:ansible/lit/supplementary@{os.environ['RELEASE_VERSION']}"
          ):
              raise SystemExit("SBOM purl does not match the collection release")
          hashes = component.get("hashes")
          if not isinstance(hashes, list) or not any(
              isinstance(item, dict)
              and item.get("alg") == "SHA-256"
              and item.get("content") == candidate_sha
              for item in hashes
          ):
              raise SystemExit("SBOM does not bind the exact collection digest")
          properties = component.get("properties")
          if not isinstance(properties, list):
              raise SystemExit("SBOM candidate properties are missing")
          actual_properties = {
              (item.get("name"), item.get("value"))
              for item in properties
              if isinstance(item, dict)
          }
          expected_properties = {
              ("lit:candidate:filename", candidate.name),
              ("lit:candidate:commit", os.environ["RELEASE_SHA"]),
          }
          if not expected_properties <= actual_properties:
              raise SystemExit("SBOM does not bind the candidate filename and source SHA")

          provenance = json.loads(
              Path("incoming/evidence/release-assets/provenance.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_provenance = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["RELEASE_SHA"],
              "candidate": candidate.name,
              "candidate_sha256": candidate_sha,
              "ref": "refs/heads/main",
              "source_ref": "refs/heads/main",
              "workflow": "Collection CI",
              "workflow_event_sha": os.environ["RELEASE_SHA"],
          }
          if any(
              provenance.get(key) != value
              for key, value in expected_provenance.items()
          ):
              raise SystemExit("provenance does not bind the exact collection release")
          PY
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            export CANDIDATE="incoming/candidate/$1" RELEASE_VERSION="$2" RELEASE_SHA="$3" GITHUB_REPOSITORY="$4"
            python3 -I /workspace/.normal-sbom-validation.py
          ' sbom-validation "$CANDIDATE_NAME" "$RELEASE_VERSION" "$RELEASE_SHA" "$GITHUB_REPOSITORY"

          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-ci.yml@refs/heads/main"
          subjects=(
            "incoming/candidate/${CANDIDATE_NAME}"
            incoming/evidence/release-assets/sbom.cdx.json
            "incoming/evidence/release-assets/collection-evidence-${RELEASE_SHA}.tar.gz"
            incoming/evidence/release-assets/SHA256SUMS
            incoming/evidence/release-assets/release-security-receipt.json
          )
          mkdir -p dist/attestation-bundles
          for subject in "${subjects[@]}"; do
            signature_bundle="incoming/evidence/release-assets/$(basename "$subject").sigstore.json"
            test -s "$signature_bundle"

            subject_path="$(realpath "$subject")"
            bundle_dir="dist/attestation-download/$(basename "$subject")"
            mkdir -p "$bundle_dir"
            (
              cd "$bundle_dir"
              gh attestation download "$subject_path" --repo "$GITHUB_REPOSITORY"
            )
            mapfile -t bundles < <(find "$bundle_dir" -maxdepth 1 -type f -name '*.jsonl' -print)
            test "${#bundles[@]}" -eq 1
            cp "${bundles[0]}" \
              "dist/attestation-bundles/$(basename "$subject").attestation.jsonl"
            if [ "${NORMAL_TWO_STAGE:-false}" = true ]; then
              WUNDER_DEVTOOLS_NETWORK=bridge bash scripts/wunder-devtools-ee.sh bash -c '
                set -euo pipefail
                test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
                cosign verify-blob --bundle "$2" \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  --certificate-identity "$3" --certificate-github-workflow-sha "$4" "$1"
                gh attestation verify "$1" --bundle "$6" --repo "$5" \
                  --cert-identity "$3" --source-ref refs/heads/main --source-digest "$4"
              ' normal-candidate-crypto "$subject" "$signature_bundle" "$identity" "$RELEASE_SHA" \
                "$GITHUB_REPOSITORY" "dist/attestation-bundles/$(basename "$subject").attestation.jsonl"
            else
            cosign verify-blob \
              --bundle "$signature_bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$identity" \
              --certificate-github-workflow-sha "$RELEASE_SHA" \
              "$subject"
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" \
              --source-ref refs/heads/main \
              --source-digest "$RELEASE_SHA"

            fi
          done

      - name: Assemble verified release attachments
        run: |
          set -euo pipefail
          operation="$GITHUB_WORKSPACE/.normal-release-assembly.sh"
          trap 'rm -f -- "$operation"' EXIT
          cat >"$operation" <<'ASSEMBLE_RELEASE'
          set -euo pipefail

          mkdir -p dist/release
          cp -a incoming/evidence/release-assets/. dist/release/
          mv dist/release/SHA256SUMS dist/release/ci-release-assets-SHA256SUMS
          mv dist/release/SHA256SUMS.sigstore.json \
            dist/release/ci-release-assets-SHA256SUMS.sigstore.json
          cp "incoming/candidate/${CANDIDATE_NAME}" dist/release/
          awk -v candidate="$CANDIDATE_NAME" \
            '$2 == candidate { print }' \
            incoming/candidate/candidate-SHA256SUMS \
            > dist/release/ci-candidate-SHA256SUMS
          test "$(wc -l < dist/release/ci-candidate-SHA256SUMS)" -eq 1
          cp incoming/evidence/evidence/security/vulnerability-report.json \
            dist/release/vulnerability-report.json
          cp incoming/evidence/evidence/security/trivy-vulnerability-report.json \
            dist/release/trivy-vulnerability-report.json
          cp incoming/evidence/evidence/security/secret-scan-summary.json \
            dist/release/secret-scan-summary.json
          cp dist/attestation-bundles/*.jsonl dist/release/
          cp incoming/evidence/long-term/collection-release-evidence-*.tar.gz \
            dist/release/
          cp incoming/evidence/long-term/collection-release-evidence-*.tar.gz.sha256 \
            dist/release/

          (
            cd dist/release
            sha256sum --check ci-candidate-SHA256SUMS
            sha256sum --check ci-release-assets-SHA256SUMS
          )

          ASSEMBLE_RELEASE
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            export CANDIDATE_NAME="$1"
            mkdir -p "$HOME/stage/dist"
            ln -s /workspace/incoming "$HOME/stage/incoming"
            ln -s /workspace/dist/attestation-bundles "$HOME/stage/dist/attestation-bundles"
            cd "$HOME/stage"
            source /workspace/.normal-release-assembly.sh >&2
            tar -cf - dist/release
          ' assemble-release "$CANDIDATE_NAME" | tar -xf -
      - name: Retain authenticated normal publication observations
        if: env.NORMAL_TWO_STAGE == 'true'
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/normal-release-native/normal-release-native-evidence.json" dist/release/
          if [ "$NORMAL_NATIVE_ARCHIVE_REUSED" = true ]; then
            cp "$RUNNER_TEMP/normal-release-native/normal-release-native-evidence.sigstore.json" dist/release/
          fi

      - name: Attest normal publication observations
        id: attest-normal-native-evidence
        if: env.NORMAL_TWO_STAGE == 'true' && env.NORMAL_NATIVE_ARCHIVE_REUSED != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: dist/release/normal-release-native-evidence.json

      - name: Verify and retain normal native evidence attestation
        if: env.NORMAL_TWO_STAGE == 'true'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-normal-native-evidence.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          if [ "$NORMAL_NATIVE_ARCHIVE_REUSED" != true ]; then
            test -s "$ATTESTATION_BUNDLE"
            cp "$ATTESTATION_BUNDLE" dist/release/normal-release-native-evidence.sigstore.json
          fi
          WUNDER_DEVTOOLS_NETWORK=bridge bash scripts/wunder-devtools-ee.sh \
            python3 -B scripts/normal_release_archive.py \
            --snapshot dist/release/normal-release-native-evidence.json \
            --bundle dist/release/normal-release-native-evidence.sigstore.json \
            --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID" --release "$RELEASE_SHA"

      - name: Prepare deterministic signed Security release evidence
        id: security-evidence
        if: env.SECURITY_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence=dist/release/security-release-evidence.json
          bundle="${evidence}.sigstore.json"
          python scripts/generate-security-release-evidence.py generate \
            --metadata "$SECURITY_METADATA" \
            --profiles .lit/security-release-profiles.json \
            --source-sha "$RELEASE_SHA" \
            --artifact "dist/release/${CANDIDATE_NAME}" \
            --signature "dist/release/${CANDIDATE_NAME}.sigstore.json" \
            --sbom dist/release/sbom.cdx.json \
            --provenance dist/release/provenance.json \
            --output "$evidence"

          release_response="$RUNNER_TEMP/existing-release-for-security-evidence.json"
          release_status="$(
            curl --silent --show-error --location \
              --output "$release_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          case "$release_status" in
            404)
              evidence_asset_count=0
              evidence_bundle_count=0
              ;;
            200)
              evidence_asset_count="$(
                jq '[.assets[] | select(.name == "security-release-evidence.json")] | length' \
                  "$release_response"
              )"
              evidence_bundle_count="$(
                jq '[.assets[] | select(.name == "security-release-evidence.json.sigstore.json")] | length' \
                  "$release_response"
              )"
              ;;
            *)
              echo "Unexpected GitHub Release lookup status: $release_status" >&2
              exit 1
              ;;
          esac
          test "$evidence_asset_count" -le 1
          test "$evidence_bundle_count" -le 1
          test "$evidence_asset_count" -eq "$evidence_bundle_count"
          if [ "$evidence_asset_count" -eq 1 ]; then
            existing_pair="$RUNNER_TEMP/existing-security-evidence-pair"
            mkdir -p "$existing_pair"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern security-release-evidence.json \
              --pattern security-release-evidence.json.sigstore.json \
              --dir "$existing_pair"
            cmp --silent "$existing_pair/security-release-evidence.json" "$evidence"
            cp "$existing_pair/security-release-evidence.json.sigstore.json" "$bundle"
          else
            cosign sign-blob --yes --bundle "$bundle" "$evidence"
          fi
          publish_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-publish.yml@refs/heads/main"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$publish_identity" \
            --certificate-github-workflow-sha "$RELEASE_SHA" \
            "$evidence"

      - name: Attest Security release evidence
        id: attest-security-evidence
        if: env.SECURITY_RELEASE == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-path: dist/release/security-release-evidence.json

      - name: Verify Security release evidence attestation
        if: env.SECURITY_RELEASE == 'true'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-security-evidence.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-security-evidence.outputs.attestation-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_ID"
          test -s "$ATTESTATION_BUNDLE"
          publish_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-publish.yml@refs/heads/main"
          gh attestation verify dist/release/security-release-evidence.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$publish_identity" \
            --source-ref refs/heads/main \
            --source-digest "$RELEASE_SHA"

      - name: Revalidate exact CI producer before external staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-ci-run.sh "$RELEASE_SHA" "$CI_RUN_ID" "$CI_RUN_ATTEMPT"

      - name: Stage exact Security candidate in native Nexus Galaxy v3
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        env:
          NEXUS_GALAXY_PASSWORD: ${{ secrets.NEXUS_GALAXY_PASSWORD }}
          NEXUS_GALAXY_REPOSITORY: ${{ vars.NEXUS_GALAXY_REPOSITORY }}
          NEXUS_GALAXY_REPOSITORY_URL: ${{ vars.NEXUS_GALAXY_REPOSITORY_URL }}
          NEXUS_GALAXY_USERNAME: ${{ secrets.NEXUS_GALAXY_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_GALAXY_REPOSITORY"
          test -n "$NEXUS_GALAXY_REPOSITORY_URL"
          test -n "$NEXUS_GALAXY_USERNAME"
          test -n "$NEXUS_GALAXY_PASSWORD"
          mkdir -p dist/validation
          python scripts/nexus-galaxy-v3-stage.py \
            --candidate "incoming/candidate/${CANDIDATE_NAME}" \
            --repository-url "$NEXUS_GALAXY_REPOSITORY_URL" \
            --repository "$NEXUS_GALAXY_REPOSITORY" \
            --output dist/validation/nexus-stage.json

      - name: Create exact staged-release handoff
        id: release-handoff
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        env:
          SECURITY_EVIDENCE_ID: ${{ needs.security-classification.outputs.security-evidence-id }}
        run: |
          set -euo pipefail
          # Retain the verified portable copies, not gh's colon-named scratch files.
          rm -rf -- dist/attestation-download
          binding="$RUNNER_TEMP/release-stage-binding.json"
          jq -S -c -n \
            --arg candidateName "$CANDIDATE_NAME" \
            --argjson ciRunAttempt "$CI_RUN_ATTEMPT" \
            --argjson ciRunId "$CI_RUN_ID" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg securityEvidenceId "$SECURITY_EVIDENCE_ID" \
            --argjson sourceRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            --arg sourceSha "$RELEASE_SHA" \
            '{candidateName: $candidateName, ciRunAttempt: $ciRunAttempt,
              ciRunId: $ciRunId, galaxyRequired: true,
              releaseVersion: $releaseVersion, securityEvidenceId: $securityEvidenceId,
              securityRelease: true, sourceRunAttempt: $sourceRunAttempt,
              sourceRunId: $sourceRunId, sourceSha: $sourceSha}' > "$binding"
          digest="$(python scripts/release-stage-handoff.py create \
            --root . --binding "$binding" --manifest release-stage-handoff.json)"
          {
            echo "sha256=$digest"
            echo "validation-required=true"
            echo "release-version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bound staged release
        id: upload-release-stage
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: release-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            incoming/
            release-stage-handoff.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Mint read-only release automation installation audit token
        id: release-automation-audit-app
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read

      - name: Verify exact release automation installation and allowlist
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        env:
          APP_INSTALLATION_ID: ${{ steps.release-automation-audit-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.release-automation-audit-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-automation-audit-app.outputs.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = lightning-it-release-automation
          test "$APP_INSTALLATION_ID" = 148019054
          installation="$RUNNER_TEMP/release-automation-installation.json"
          gh api /installation > "$installation"
          jq -e '
            .id == 148019054
            and .app_slug == "lightning-it-release-automation"
            and .target_type == "Organization"
            and .account.login == "lightning-it"
            and .repository_selection == "selected"
            and .permissions == {
              "actions": "write",
              "checks": "read",
              "contents": "write",
              "metadata": "read",
              "pull_requests": "write"
            }
          ' "$installation" >/dev/null
          actual_repositories="$(
            gh api --paginate 'installation/repositories?per_page=100' \
              | jq -sc '[.[].repositories[].full_name] | sort | unique'
          )"
          expected_repositories='["lightning-it/ansible-collection-supplementary"'
          expected_repositories+=',"lightning-it/container-ee-wunder-ansible-ubi9"'
          expected_repositories+=',"lightning-it/github-management-lit"'
          expected_repositories+=',"lightning-it/modulix-validation"'
          expected_repositories+=',"lightning-it/shared-assets-lit"]'
          test "$actual_repositories" = "$expected_repositories"

      - name: Mint exact ModuLix validation App token
        id: modulix-validation-app
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: modulix-validation
          permission-actions: write
          permission-contents: read

      - name: Dispatch exact ModuLix validation request once
        id: modulix-dispatch
        if: env.SECURITY_RELEASE == 'true' && env.GALAXY_REQUIRED == 'true'
        env:
          APP_INSTALLATION_ID: ${{ steps.modulix-validation-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.modulix-validation-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.modulix-validation-app.outputs.token }}
          SECURITY_EVIDENCE_ID: ${{ needs.security-classification.outputs.security-evidence-id }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = lightning-it-release-automation
          test "$APP_INSTALLATION_ID" = 148019054
          result="$RUNNER_TEMP/modulix-validation-dispatch.json"
          python scripts/modulix-validation-receipt.py \
            --phase dispatch \
            --nexus-manifest dist/validation/nexus-stage.json \
            --source-sha "$RELEASE_SHA" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --security-evidence-id "$SECURITY_EVIDENCE_ID" \
            --version "$RELEASE_VERSION" \
            --app-slug "$APP_SLUG" \
            --installation-id "$APP_INSTALLATION_ID" > "$result"
          jq -e '.state == "dispatched" or .state == "found"' "$result" >/dev/null
          {
            echo "controller-sha=$(jq -er '.controllerSha' "$result")"
            echo "request-id=$(jq -er '.requestId' "$result")"
            echo "controller-run-id=$(jq -r '.controllerRunId // empty' "$result")"
            echo "controller-run-attempt=$(jq -r '.controllerRunAttempt // empty' "$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Finalize immutable release attachments and notes
        if: env.SECURITY_RELEASE != 'true' || env.GALAXY_REQUIRED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${NORMAL_TWO_STAGE:-false}" = true ]; then
            # Normal release EE transport; no credentials enter the validator.
          set -euo pipefail
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            cd dist/release
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '"'"'%f\n'"'"' \
              | sort | xargs sha256sum
          ' >dist/release/SHA256SUMS
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            cd dist/release
            test -s SHA256SUMS
            sha256sum --check SHA256SUMS
          '
          publish_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collection-publish.yml@refs/heads/main"
          release_response="$RUNNER_TEMP/existing-release-for-checksum-bundle.json"
          release_status="$(
            curl --silent --show-error --location \
              --output "$release_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          )"
          case "$release_status" in
            404)
              checksum_asset_count=0
              bundle_asset_count=0
              ;;
            200)
              checksum_asset_count="$(
                jq '[.assets[] | select(.name == "SHA256SUMS")] | length' \
                  "$release_response"
              )"
              bundle_asset_count="$(
                jq '[.assets[] | select(.name == "SHA256SUMS.sigstore.json")] | length' \
                  "$release_response"
              )"
              ;;
            *)
              echo "Unexpected GitHub Release lookup status: $release_status" >&2
              exit 1
              ;;
