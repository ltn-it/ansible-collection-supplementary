# yamllint disable rule:truthy
---
name: Prepare collection release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Stable release version, for example 1.2.3. It must equal the next version implied by reviewed fragments.
        required: false
        default: ""
      base_branch:
        description: Content base. Normal preparation requires develop; Security requires main.
        required: false
        default: ""
      target_branch:
        description: Release PR target. Normal preparation requires develop; Security requires main.
        required: false
        default: ""
      create_github_release:
        description: Create a GitHub release after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      publish_galaxy:
        description: Publish to Ansible Galaxy after merge.
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      security_evidence_id:
        description: Exact MLX-90 Evidence ID; release automation only.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-prepare-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  security-classification:
    name: Classify evidence-bound Security release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      security-release: ${{ steps.classify.outputs.security_release }}
      security-evidence-id: ${{ steps.classify.outputs.security_evidence_id }}
      security-version: ${{ steps.classify.outputs.security_version }}
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable pre-consumption binding base
        id: binding
        env:
          BEFORE_SHA: ${{ github.event.before || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha="$GITHUB_SHA"
          if [ "$EVENT_NAME" = push ] && \
              git diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA" -- \
                changelogs/release-preparation.json \
                | grep -Fxq changelogs/release-preparation.json
          then
            receipt=changelogs/release-preparation.json
            test -f "$receipt"
            test ! -L "$receipt"
            base_sha="$(
              jq -er '.base_sha | select(test("^[0-9a-f]{40}$"))' "$receipt"
            )"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
      - name: Checkout immutable pre-consumption Security binding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.binding.outputs.base_sha }}
          path: security-binding-base
          persist-credentials: false
      - name: Classify before selecting a protected environment
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          EVIDENCE_ID: ${{ inputs.security_evidence_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          commit_message="$(git show -s --format=%B "$GITHUB_SHA")"
          classification="$(bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            # Process-local exact workspace trust; no global or wildcard admission.
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/workspace
            if [ "$1" = push ]; then
              python3 -B scripts/classify-security-release.py --event-kind push \
                --base-sha "$2" --head-sha "$3" --ref "$4" --commit-message "$5" \
                --evidence-id "$6" --binding-root security-binding-base --github-output "$HOME/classification"
            else
              python3 -B scripts/classify-security-release.py --event-kind version \
                --version "$7" --evidence-id "$6" --binding-root security-binding-base \
                --github-output "$HOME/classification"
            fi >&2
            cat "$HOME/classification"
          ' classify-release "$EVENT_NAME" "$BEFORE_SHA" "$GITHUB_SHA" "$GITHUB_REF" \
            "$commit_message" "$EVIDENCE_ID" "$VERSION")"
          printf '%s\n' "$classification" >>"$GITHUB_OUTPUT"

  normal-readiness:
    name: Check normal release need before environment or App access
    needs: security-classification
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.security-classification.outputs.security-release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.need.outputs.ready }}
      content-sha: ${{ steps.tips.outputs.content_sha }}
    steps:
      - name: Checkout protected Main tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind current protected Main and Develop tips
        id: tips
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_INPUT: ${{ inputs.base_branch || '' }}
          TARGET_INPUT: ${{ inputs.target_branch || '' }}
        run: |
          set -euo pipefail
          test "${BASE_INPUT:-develop}" = develop
          test "${TARGET_INPUT:-develop}" = develop
          main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main")"
          develop="$(gh api "repos/${GITHUB_REPOSITORY}/branches/develop")"
          jq -e --arg sha "$GITHUB_SHA" '.protected == true and .commit.sha == $sha' <<<"$main" >/dev/null
          content_sha="$(jq -er 'select(.protected == true) | .commit.sha' <<<"$develop")"
          [[ "$content_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$content_sha"
          echo "content_sha=$content_sha" >>"$GITHUB_OUTPUT"
      - name: Export only exact protected Develop YAML data
        env:
          CONTENT_SHA: ${{ steps.tips.outputs.content_sha }}
        run: |
          set -euo pipefail
          # Only fixed data bytes leave the offline, read-only validation environment.
          bash scripts/wunder-devtools-ee.sh bash -c '
            set -euo pipefail
            python3 -B scripts/release_readiness_data.py \
              --revision "$1" --destination "$HOME/release-readiness-content"
            tar -C "$HOME" -cf - release-readiness-content
          ' export-release-data "$CONTENT_SHA" | tar -xf -
      - name: Check actual unreleased fragments and recheck bound tips
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_SHA: ${{ steps.tips.outputs.content_sha }}
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          content=release-readiness-content
          fragments="$content/changelogs/fragments"
          test -d "$fragments"
          test ! -L "$fragments"
          if [ -z "$(find "$fragments" -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print -quit)" ]; then
            echo '::notice::No unreleased Develop fragments remain; release preparation is a no-op.'
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Consumed releases need no joined ancestry; a new release must have it.
          git merge-base --is-ancestor "$GITHUB_SHA" "$CONTENT_SHA"
          # LI-344 generator closure:start
          # Plugin discovery can execute code. Converge it through the ordinary
          # Main promotion first; no Develop code/config runs with release credentials.
          if ! git diff --exit-code --quiet --no-ext-diff --no-textconv \
              "$GITHUB_SHA" "$CONTENT_SHA" -- plugins collections ansible.cfg \
              meta changelogs/config.yaml ':(glob)roles/*/meta/**'; then
            echo '::error::Release generator plugin/config differs from protected Main;'
            echo 'complete the ordinary Main convergence before preparing this release.'
            exit 1
          fi
          main_roles="$(git ls-tree --name-only "$GITHUB_SHA:roles" 2>/dev/null || true)"
          content_roles="$(git ls-tree --name-only "$CONTENT_SHA:roles" 2>/dev/null || true)"
          if [ "$main_roles" != "$content_roles" ]; then
            echo '::error::Role documentation inventory differs; complete ordinary Main convergence first.'
            exit 1
          fi
          # LI-344 generator closure:end
          # Execute only the protected Main parser against the exact Develop data.
          resolution="$(
            bash scripts/wunder-devtools-ee.sh python3 -B scripts/release-version.py \
              --galaxy "$content/galaxy.yml" --fragments "$fragments" \
              --requested-version "$VERSION_INPUT" --root "$content"
          )"
          main_version="$(bash scripts/wunder-devtools-ee.sh python3 -I -c '
          from pathlib import Path
          import yaml
          print(yaml.safe_load(Path("galaxy.yml").read_text())["version"])
          ')"
          if [ "$(jq -er '.current_version' <<<"$resolution")" != "$main_version" ]; then
            echo '::error::Develop release baseline differs from Main;' \
              'complete the existing release or baseline convergence first.'
            exit 1
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq .object.sha)" = "$CONTENT_SHA"
          echo 'ready=true' >>"$GITHUB_OUTPUT"

  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [security-classification, normal-readiness]
    if: >-
      always() && needs.security-classification.result == 'success' &&
      (needs.security-classification.outputs.security-release == 'true' ||
       (needs.normal-readiness.result == 'success' && needs.normal-readiness.outputs.ready == 'true')) &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release): prepare v')
        )
      ) &&
      (needs.security-classification.outputs.security-release == 'false' ||
       (needs.security-classification.outputs.security-release == 'true' &&
        github.actor == 'lightning-it-release-automation[bot]'))
    environment:
      name: >-
        ${{ needs.security-classification.outputs.security-release == 'true' &&
            github.actor == 'lightning-it-release-automation[bot]' &&
            'mlx90-security-release-prepare' ||
            'ansible-collection-release-prepare' }}

    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact protected Main controller before App access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select Security legacy funding or producer-only data path
        id: security-route
        if: needs.security-classification.outputs.security-release == 'true'
        run: |
          set -euo pipefail
          mode="$(python scripts/security_premerge_proof.py route --root . --source "$GITHUB_SHA")"
          echo "mode=$mode" >>"$GITHUB_OUTPUT"

      - name: Recheck normal protected tips before minting App credentials
        if: needs.security-classification.outputs.security-release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_SHA: ${{ needs.normal-readiness.outputs.content-sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq .object.sha)" = "$CONTENT_SHA"

      - name: Verify immutable normal release toolchain before App access
        if: needs.security-classification.outputs.security-release == 'false'
        run: |
          bash scripts/wunder-devtools-ee.sh python3 -I -c '
          import importlib.metadata
          import sys
          expected = {"ansible-core": "2.18.19", "antsibull-changelog": "0.35.1", "PyYAML": "6.0.3"}
          assert sys.version_info[:2] == (3, 11), "pinned release Python unavailable"
          for package, version in expected.items():
              actual = importlib.metadata.version(package)
              assert actual == version, f"pinned release tool unavailable: {package}"
              print(f"{package}=={actual}")
          '

      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release automation App bot identity
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot_json="$(gh api "users/${APP_SLUG}%5Bbot%5D" 2>/dev/null || printf '{}')"
          login="$(jq -r '.login // ""' <<<"$bot_json")"
          bot_id="$(jq -r '.id // ""' <<<"$bot_json")"
          if [ "$login" != "${APP_SLUG}[bot]" ] || ! [[ "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve the release automation App bot identity."
            exit 1
          fi
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - name: Setup Python
        if: needs.security-classification.outputs.security-release == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"

      - name: Install release tools
        if: needs.security-classification.outputs.security-release == 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            ansible-core==2.18.18 \
            antsibull-changelog==0.35.1 \
            PyYAML==6.0.3

      - name: Prepare release branch
        id: prepare-release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          BASE_BRANCH_INPUT: ${{ github.event.inputs.base_branch }}
          TARGET_BRANCH_INPUT: ${{ github.event.inputs.target_branch }}
          CREATE_GITHUB_RELEASE_INPUT: ${{ github.event.inputs.create_github_release }}
          PUBLISH_GALAXY_INPUT: ${{ github.event.inputs.publish_galaxy }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SECURITY_RELEASE: ${{ needs.security-classification.outputs.security-release }}
          SECURITY_VERSION: ${{ needs.security-classification.outputs.security-version }}
          NORMAL_CONTENT_SHA: ${{ needs.normal-readiness.outputs.content-sha }}
          SECURITY_REVIEW_ROUTE: ${{ steps.security-route.outputs.mode }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Candidate data never contributes interpreter import or Ansible config paths.
          unset PYTHONPATH PYTHONHOME ANSIBLE_CONFIG
          export PYTHONDONTWRITEBYTECODE=1

          authenticated_push() {
            GH_TOKEN="$GH_TOKEN" git -c credential.helper= \
              -c 'credential.helper=!gh auth git-credential' \
              push "$@"
          }

          VERSION="${VERSION_INPUT:-}"
          TARGET_BRANCH="${TARGET_BRANCH_INPUT:-}"
          CREATE_GITHUB_RELEASE="${CREATE_GITHUB_RELEASE_INPUT:-true}"
          PUBLISH_GALAXY="${PUBLISH_GALAXY_INPUT:-true}"

          # Credentials and executable tooling stay on the protected Main event.
          test "$GITHUB_REF" = refs/heads/main
          WORKFLOW_SOURCE_SHA="$GITHUB_SHA"
          workflow_source="$RUNNER_TEMP/release-workflow-source"
          test ! -e "$workflow_source"
          git worktree add --detach "$workflow_source" "$WORKFLOW_SOURCE_SHA"
          if [ "$SECURITY_RELEASE" = true ]; then
            BASE_BRANCH="${BASE_BRANCH_INPUT:-main}"
            TARGET_BRANCH="${TARGET_BRANCH:-main}"
            test "$BASE_BRANCH" = main
            test "$TARGET_BRANCH" = main
          else
            test "$SECURITY_RELEASE" = false
            BASE_BRANCH="${BASE_BRANCH_INPUT:-develop}"
            TARGET_BRANCH="${TARGET_BRANCH:-develop}"
            test "$BASE_BRANCH" = develop
            test "$TARGET_BRANCH" = develop
          fi

          git config user.name "${{ steps.release-bot.outputs.login }}"
          git config user.email "${{ steps.release-bot.outputs.email }}"
          git fetch origin "$BASE_BRANCH" "$TARGET_BRANCH"
          git switch -C release-prepare-base "origin/$BASE_BRANCH"
          BASE_SHA="$(git rev-parse HEAD)"
          export BASE_SHA
          if [ "$SECURITY_RELEASE" = false ]; then
            test "$BASE_SHA" = "$NORMAL_CONTENT_SHA"
            git merge-base --is-ancestor "$WORKFLOW_SOURCE_SHA" "$BASE_SHA"
          fi

          # LI-360 normal EE transport:start
          release_environment="$RUNNER_TEMP/normal-release-environment.sh"
          test ! -e "$release_environment"
          git show "$WORKFLOW_SOURCE_SHA:scripts/normal_release_environment.sh" > "$release_environment"
          # The candidate checkout cannot supply the executed helper.
          # shellcheck disable=SC1090
          source "$release_environment"
          # LI-360 normal EE transport:end

          fragment_count="$(
            find changelogs/fragments \
              -maxdepth 1 \
              -type f \
              \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name '.gitkeep' \
              | wc -l
          )"
          if [ "$fragment_count" -eq 0 ]; then
            echo "No changelog fragments found; no collection release PR needed."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_args=()
          if [ "$SECURITY_RELEASE" = true ]; then
            [[ "$SECURITY_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test -z "$VERSION" || test "$VERSION" = "$SECURITY_VERSION"
            version_args=(--security-target-version "$SECURITY_VERSION")
          elif [ -n "$VERSION" ]; then
            version_args=(--requested-version "$VERSION")
          fi
          version_resolution="$(release_data "${version_args[@]}" <<'RELEASE_VERSION'
            python "$workflow_source/scripts/release-version.py" \
              --galaxy galaxy.yml \
              --fragments changelogs/fragments \
              --write-preparation-receipt changelogs/release-preparation.json \
              --repository "$GITHUB_REPOSITORY" \
              --repository-id "$REPOSITORY_ID" \
              --base-sha "$BASE_SHA" \
              --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
              --create-github-release "$CREATE_GITHUB_RELEASE" \
              --publish-galaxy "$PUBLISH_GALAXY" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --workflow-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$WORKFLOW_REF" \
              --workflow-event "$WORKFLOW_EVENT" \
              --workflow-actor "$WORKFLOW_ACTOR" \
              --root . \
              "$@"
          RELEASE_VERSION
          )"
          VERSION="$(jq -er '.version' <<< "$version_resolution")"
          RELEASE_IMPACT="$(jq -er '.impact' <<< "$version_resolution")"
          PREPARATION_MODE="$(jq -er '.release_mode' changelogs/release-preparation.json)"
          if [ "$SECURITY_RELEASE" = true ]; then
            test "$PREPARATION_MODE" = security
            SECURITY_CHAIN_ID="$(jq -er '.chain_id' changelogs/release-preparation.json)"
            [[ "$SECURITY_CHAIN_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          else
            test "$SECURITY_RELEASE" = false
            test "$PREPARATION_MODE" = normal
            SECURITY_CHAIN_ID=""
          fi
          export VERSION

          tag_matches="$(
            git ls-remote --tags origin \
              "refs/tags/v${VERSION}" \
              "refs/tags/v${VERSION}^{}"
          )"
          if [ -n "$tag_matches" ]; then
            echo "::error::Immutable tag v${VERSION} already exists."
            exit 1
          fi

          github_release_response="$(mktemp)"
          github_release_status="$(
            curl --silent --show-error --location \
              --output "$github_release_response" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}"
          )"
          case "$github_release_status" in
            404) ;;
            200)
              echo "::error::GitHub Release v${VERSION} already exists."
              exit 1
              ;;
            *)
              echo "::error::Could not prove GitHub Release v${VERSION} is absent (HTTP ${github_release_status})."
              exit 1
              ;;
          esac

          if [ "$PUBLISH_GALAXY" = "true" ]; then
            galaxy_response="$(mktemp)"
            galaxy_status="$(
              curl --silent --show-error --location \
                --output "$galaxy_response" \
                --write-out '%{http_code}' \
                "https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/index/lit/supplementary/versions/${VERSION}/"
            )"
            case "$galaxy_status" in
              404) ;;
              200)
                echo "::error::Ansible Galaxy collection version ${VERSION} already exists."
                exit 1
                ;;
              *)
                echo "::error::Could not prove Galaxy version ${VERSION} is absent (HTTP ${galaxy_status})."
                exit 1
                ;;
            esac
          fi

          RELEASE_BRANCH="release/v${VERSION}"
          release_ref="refs/heads/${RELEASE_BRANCH}"
          remote_release_sha="$(
            git ls-remote --heads origin "$release_ref" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [ -n "$remote_release_sha" ] && \
              ! [[ "$remote_release_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Could not resolve a trustworthy release-branch lease."
            exit 1
          fi
          echo "Preparing reviewed ${RELEASE_IMPACT} release v${VERSION} from ${BASE_BRANCH} to ${TARGET_BRANCH}."

          git switch -C "$RELEASE_BRANCH" "origin/$BASE_BRANCH"

          release_data <<'RELEASE_GENERATE'
          python -I - <<'PY'
          import os
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          def write_yaml(path, data):
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )

          version = os.environ["VERSION"]
          path = Path("galaxy.yml")
          data = yaml.safe_load(path.read_text())
          data["version"] = version
          write_yaml(path, data)
          PY

          fragment_stash=""
          selected_fragment=""
          if [ "$PREPARATION_MODE" = security ]; then
            selected_fragment="$(
              jq -er '
                .fragments
                | if length == 1 then .[0].path else error("expected one Security fragment") end
                | select(test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.ya?ml$"))
              ' changelogs/release-preparation.json
            )"
            test -f "changelogs/fragments/$selected_fragment"
            test ! -L "changelogs/fragments/$selected_fragment"
            fragment_stash="$RUNNER_TEMP/unselected-release-fragments-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            test ! -e "$fragment_stash"
            mkdir -m 0700 "$fragment_stash"
            while IFS= read -r -d '' fragment; do
              name="${fragment##*/}"
              if [ "$name" != "$selected_fragment" ]; then
                mv -- "$fragment" "$fragment_stash/$name"
              fi
            done < <(
              find changelogs/fragments -maxdepth 1 -type f \
                \( -name '*.yml' -o -name '*.yaml' \) -print0
            )
          fi

          # LI-344 protected generator:start
          # Export bounded regular data only. Main retains all executable code,
          # plugin discovery paths and its exact generator configuration.
          export workflow_source
          python -I - <<'PYDATA'
          import os
          import re
          import shutil
          from pathlib import Path
          import yaml

          source = Path.cwd()
          tooling = Path(os.environ["workflow_source"])
          limit = 16 * 1024 * 1024

          def regular(path):
              if path.is_symlink() or not path.is_file() or path.stat().st_size > limit:
                  raise SystemExit(f"bounded regular release data required: {path}")
              for parent in path.parents:
                  if parent.is_symlink():
                      raise SystemExit("release data parent is a symlink")
              return path

          config = yaml.safe_load(regular(tooling / "changelogs/config.yaml").read_text())
          if (config.get("output") != [{"file": "CHANGELOG.rst", "format": "rst"}]
                  or config.get("notesdir", "fragments") != "fragments"
                  or config.get("changes_file", "changelog.yaml") != "changelog.yaml"
                  or config.get("keep_fragments", False) is not False
                  or config.get("archive_path_template") is not None):
              raise SystemExit("protected generator must use the fixed release data paths")
          paths = ("galaxy.yml", "changelogs/changelog.yaml", "changelogs/.plugin-cache.yaml")
          for name in paths:
              incoming, target = source / name, tooling / name
              regular(target)
              if incoming.exists() or incoming.is_symlink():
                  shutil.copyfile(regular(incoming), target)
          for path in (tooling / "changelogs/fragments").iterdir():
              if path.suffix in {".yml", ".yaml"}:
                  regular(path).unlink()
          fragments = source / "changelogs/fragments"
          if fragments.is_symlink() or not fragments.is_dir():
              raise SystemExit("regular fragment directory required")
          selected = [path for path in fragments.iterdir() if path.suffix in {".yml", ".yaml"}]
          if len(selected) > 256:
              raise SystemExit("fragment count exceeds limit")
          for path in selected:
              if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*\.ya?ml", path.name) is None:
                  raise SystemExit("unsafe fragment filename")
              shutil.copyfile(regular(path), tooling / "changelogs/fragments" / path.name)
          PYDATA
          (
            cd "$workflow_source"
            export ANSIBLE_CONFIG="$workflow_source/ansible.cfg"
            antsibull-changelog lint
            antsibull-changelog release
          )
          python -I - <<'PYRESULT'
          import os
          import shutil
          from pathlib import Path

          tooling = Path(os.environ["workflow_source"])
          for name in ("CHANGELOG.rst", "changelogs/changelog.yaml", "changelogs/.plugin-cache.yaml"):
              source, target = tooling / name, Path(name)
              if source.is_symlink() or not source.is_file() or source.stat().st_size > 16 * 1024 * 1024:
                  raise SystemExit("bounded regular generator result required")
              if target.is_symlink() or any(parent.is_symlink() for parent in target.parents):
                  raise SystemExit("generator result target is a symlink")
              shutil.copyfile(source, target)
          for path in Path("changelogs/fragments").iterdir():
              if path.suffix in {".yml", ".yaml"} and not (tooling / "changelogs/fragments" / path.name).exists():
                  path.unlink()
          PYRESULT
          # LI-344 protected generator:end

          if [ "$PREPARATION_MODE" = security ]; then
            test ! -e "changelogs/fragments/$selected_fragment"
            while IFS= read -r -d '' fragment; do
              mv -- "$fragment" "changelogs/fragments/${fragment##*/}"
            done < <(find "$fragment_stash" -maxdepth 1 -type f -print0)
            rmdir "$fragment_stash"
          fi

          python -I - <<'PY'
          from pathlib import Path
          import yaml

          class LintFriendlyDumper(yaml.SafeDumper):
              def increase_indent(self, flow=False, indentless=False):
                  return super().increase_indent(flow, False)

          for path in (
              Path("galaxy.yml"),
              Path("changelogs/changelog.yaml"),
              Path("changelogs/.plugin-cache.yaml"),
          ):
              if not path.exists():
                  continue
              data = yaml.safe_load(path.read_text())
              path.write_text(
                  yaml.dump(
                      data,
                      Dumper=LintFriendlyDumper,
                      sort_keys=False,
                      explicit_start=True,
                  )
              )
          PY

          RELEASE_GENERATE

          release_data <<'RELEASE_BUILD'
          if [ "$SECURITY_RELEASE" = true ]; then
            ansible-galaxy collection build --force
          else
            # The image owns Python 3.11.13/core 2.18.19/antsibull 0.35.1.
            # Build from protected Main CWD; the candidate is collection data.
            cd "$workflow_source"
            ansible-galaxy collection build "$GITHUB_WORKSPACE" --output-path "$RUNNER_TEMP" --force
          fi
          RELEASE_BUILD

          tarball="$(ls ./*.tar.gz)"
          summary="$(
            awk \
              '/^v'"$VERSION"'$/{flag=1; print; next} /^v[0-9]/{if(flag) exit} flag {print}' \
              CHANGELOG.rst
          )"

          git add galaxy.yml changelogs CHANGELOG.rst
          git commit -m "chore(release): prepare v${VERSION}"
          pushed_sha="$(git rev-parse HEAD)"
          if [ -n "$remote_release_sha" ]; then
            git fetch --no-tags origin "$release_ref"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_release_sha"
            git switch --detach "$remote_release_sha"
            pushed_sha="$remote_release_sha"
          fi

          promotion_base="$RUNNER_TEMP/release-promotion-base"
          test ! -e "$promotion_base"
          git worktree add --detach "$promotion_base" "$BASE_SHA"
          if [ "$PREPARATION_MODE" = security ]; then
            python "$promotion_base/scripts/security_main_promotion.py" \
              --base-root "$promotion_base" \
              --head-root "$GITHUB_WORKSPACE" \
              --base-sha "$BASE_SHA" \
              --head-sha "$pushed_sha" \
              --head-ref "$RELEASE_BRANCH" >/dev/null
          else
            git -C "$normal_ee_space/data" fetch --quiet --no-tags "$GITHUB_WORKSPACE" "$pushed_sha"
            git -C "$normal_ee_space/data" checkout --quiet --force --detach "$pushed_sha"
            release_data <<'RELEASE_PREPARATION_PROOF'
            python "$workflow_source/scripts/normal_release_proof.py" preparation \
              --root "$GITHUB_WORKSPACE" --head "$pushed_sha" --base "$BASE_SHA" \
              --workflow-source "$WORKFLOW_SOURCE_SHA" \
              --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID"
          RELEASE_PREPARATION_PROOF
            # Reusing an immutable branch also reuses its approved publication settings.
            test "$(jq -er '.publication.github_release | tostring' changelogs/release-preparation.json)" = \
              "$CREATE_GITHUB_RELEASE"
            test "$(jq -er '.publication.galaxy | tostring' changelogs/release-preparation.json)" = "$PUBLISH_GALAXY"
            # The protected branches cannot drift between preparing and pushing.
            test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$BASE_SHA"
            test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$WORKFLOW_SOURCE_SHA"
          fi
          git worktree remove "$promotion_base"

          if [ -z "$remote_release_sha" ]; then
            authenticated_push origin "HEAD:${release_ref}"
            test "$(git ls-remote origin "$release_ref" | awk '{print $1}')" = \
              "$pushed_sha"
          else
            echo "Reusing the already verified immutable release branch head ${pushed_sha}."
          fi

          body_file="$(mktemp)"
          {
            echo "## Release v${VERSION}"
            echo
            echo "Base branch: \`${BASE_BRANCH}\`"
            echo "Target branch: \`${TARGET_BRANCH}\`"
            echo "Build artifact: \`${tarball}\`"
            echo "GitHub release creation: \`${CREATE_GITHUB_RELEASE}\`"
            echo "Galaxy publishing: \`${PUBLISH_GALAXY}\`"
            echo "Reviewed semantic impact: \`${RELEASE_IMPACT}\`"
            echo "Release mode: \`${PREPARATION_MODE}\`"
            if [ "$PREPARATION_MODE" = security ]; then
              echo "MLX-90 chain: \`${SECURITY_CHAIN_ID}\`"
              echo "- Human actions in the successful Security path: \`0\`"
            fi
            echo "Required merge method: \`merge commit\` (squash and rebase are prohibited)"
            echo
            echo "## Changelog summary"
            echo
            if [ -n "$summary" ]; then
              echo '```rst'
              echo "$summary"
              echo '```'
            else
              echo "See generated changelog files in this PR."
            fi
          } > "$body_file"

          owned_pulls="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open \
              -f "base=${TARGET_BRANCH}" \
              -f "head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
              -f per_page=100
          )"
          owned_count="$(jq 'length' <<< "$owned_pulls")"
          if [ "$owned_count" -gt 1 ]; then
            echo "::error::Multiple same-repository release PRs exist."
            exit 1
          fi
          emit_premerge=false
          if [ "$PREPARATION_MODE" = security ]; then
            if [ "$owned_count" -eq 0 ] || [ "$(jq -r '.[0].draft' <<<"$owned_pulls")" = true ]; then
              emit_premerge=true
              python "$workflow_source/scripts/security_premerge_proof.py" locator --kind preparation >>"$body_file"
            else
              # Existing ready/paid heads never become retroactive Common candidates.
              test "$SECURITY_REVIEW_ROUTE" = legacy
              jq -r '.[0].body // ""' <<<"$owned_pulls" >"$body_file"
            fi
          fi
          if [ "$owned_count" -eq 0 ]; then
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$RELEASE_BRANCH" \
              --draft \
              --title "Release v${VERSION}" \
              --body-file "$body_file"
          fi

          max_pr_lookup_attempts=6
          successful_pr_lookup_count=0
          owned_pr_ready=false
          owned_pulls='[]'
          for (( attempt=1; attempt<=max_pr_lookup_attempts; attempt++ )); do
            lookup_outcome=api-failure
            if ! owned_pulls="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f "base=${TARGET_BRANCH}" \
                -f "head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
                -f per_page=100
            )"; then
              owned_pulls='[]'
              if [ "$attempt" -eq "$max_pr_lookup_attempts" ]; then
                if [ "$successful_pr_lookup_count" -eq 0 ]; then
                  echo "::error::Release PR lookup failed on all ${max_pr_lookup_attempts} API attempts."
                else
                  echo "::error::Release PR lookup failed on the final API attempt after" \
                    "${successful_pr_lookup_count} successful but non-converged response(s)."
                fi
                exit 1
              fi
            else
              lookup_outcome=non-converged
              successful_pr_lookup_count=$((successful_pr_lookup_count + 1))
              if ! owned_count="$(
                jq -er 'if type == "array" then length else error("response is not an array") end' \
                  <<< "$owned_pulls"
              )"; then
                echo "::error::Release PR lookup returned invalid JSON or an unexpected response shape."
                exit 1
              fi
              if [ "$owned_count" -gt 1 ]; then
                owned_numbers="$(jq -c 'map(.number)' <<< "$owned_pulls")"
                echo "::error::Multiple same-repository release PRs exist: ${owned_numbers}."
                exit 1
              fi
              if [ "$owned_count" -eq 1 ] && jq -e \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg branch "$RELEASE_BRANCH" \
                --arg base "$TARGET_BRANCH" \
                --arg sha "$pushed_sha" '
                  .[0].head.repo.full_name == $repo
                  and .[0].user.login == "lightning-it-release-automation[bot]"
                  and .[0].user.type == "Bot"
                  and .[0].head.ref == $branch
                  and .[0].head.sha == $sha
                  and .[0].base.ref == $base
                ' <<< "$owned_pulls" >/dev/null
              then
                owned_pr_ready=true
                break
              fi
            fi

            if [ "$attempt" -lt "$max_pr_lookup_attempts" ]; then
              retry_delay=$((1 << (attempt - 1)))
              case "$lookup_outcome" in
                api-failure)
                  echo "::notice::Release PR API request failed; retrying in ${retry_delay}s."
                  ;;
                non-converged)
                  echo "::notice::Release PR lookup has not converged to the exact expected state;" \
                    "retrying in ${retry_delay}s."
                  ;;
                *)
                  echo "::error::Unexpected Release PR lookup outcome: ${lookup_outcome}."
                  exit 1
                  ;;
              esac
              sleep "$retry_delay"
            fi
          done
          if [ "$owned_pr_ready" != true ]; then
            observed_release_pr="$(
              jq -c '
                map({
                  number,
                  head_repository: .head.repo.full_name,
                  head_ref: .head.ref,
                  head_sha: .head.sha,
                  base_ref: .base.ref
                })
              ' <<< "$owned_pulls"
            )"
            echo "::error::Release PR did not converge to the exact same-repository ref/base/head" \
              "after ${max_pr_lookup_attempts} API attempts. Expected" \
              "${GITHUB_REPOSITORY}:${RELEASE_BRANCH}@${pushed_sha} -> ${TARGET_BRANCH};" \
              "observed ${observed_release_pr}."
            exit 1
          fi
          existing="$(jq -r '.[0].number' <<< "$owned_pulls")"
          gh pr edit "$existing" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${VERSION}" \
            --body-file "$body_file"
          if [ "$PREPARATION_MODE" = normal ] && [ "$(jq -r '.[0].draft' <<< "$owned_pulls")" = true ]; then
            gh pr ready "$existing" --repo "$GITHUB_REPOSITORY"
          fi
          owned_pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${existing}")"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$RELEASE_BRANCH" \
            --arg base "$TARGET_BRANCH" \
            --arg sha "$pushed_sha" \
            --argjson expected_draft "$emit_premerge" '
              .state == "open"
              and .draft == $expected_draft
              and .head.repo.full_name == $repo
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.type == "Bot"
              and .head.ref == $branch
              and .head.sha == $sha
              and .base.ref == $base
            ' <<<"$owned_pull" >/dev/null
          if [ "$PREPARATION_MODE" = security ]; then
            printf '%s\n' "$owned_pull" >"$RUNNER_TEMP/security-premerge-pull.json"
          fi
          {
            echo "number=$existing"
            echo "head_sha=$pushed_sha"
            echo "emit_premerge=$emit_premerge"
          } >>"$GITHUB_OUTPUT"

      - name: Remove disposable normal release data workspace
        if: always() && needs.security-classification.outputs.security-release == 'false'
        run: |
          rm -rf -- "$RUNNER_TEMP/normal-release-ee" "$RUNNER_TEMP/release-data-operation.sh" \
            "$RUNNER_TEMP/normal-release-environment.sh"

      - name: Emit exact native Security preparation data packet
        if: steps.prepare-release.outputs.emit_premerge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_path="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method GET "$run_path" >"$RUNNER_TEMP/security-premerge-run.json"
          gh api --method GET "${run_path}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            >"$RUNNER_TEMP/security-premerge-jobs.json"
          python "$RUNNER_TEMP/release-workflow-source/scripts/security_premerge_proof.py" emit \
            --kind preparation --root "$GITHUB_WORKSPACE" --source "$GITHUB_SHA" \
            --pull "$RUNNER_TEMP/security-premerge-pull.json" --run "$RUNNER_TEMP/security-premerge-run.json" \
            --jobs "$RUNNER_TEMP/security-premerge-jobs.json" \
            --output "$RUNNER_TEMP/security-premerge-artifact/security-premerge-proof.json"

      - name: Upload pre-merge Security preparation producer data
        if: steps.prepare-release.outputs.emit_premerge == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: security-premerge-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-premerge-artifact/security-premerge-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Finalize Security readiness after native data upload
        if: needs.security-classification.outputs.security-release == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          PR_NUMBER: ${{ steps.prepare-release.outputs.number }}
          HEAD_SHA: ${{ steps.prepare-release.outputs.head_sha }}
          REVIEW_ROUTE: ${{ steps.security-route.outputs.mode }}
          SECURITY_VERSION: ${{ needs.security-classification.outputs.security-version }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = 'lightning-it-release-automation[bot]'
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if [ "$REVIEW_ROUTE" = producer-only ]; then
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg base "$GITHUB_SHA" \
              --arg head "$HEAD_SHA" --arg ref "release/v${SECURITY_VERSION}" '
              .state == "open" and .draft == true
              and .base.ref == "main" and .base.sha == $base and .base.repo.full_name == $repo
              and .head.sha == $head and .head.ref == $ref and .head.repo.full_name == $repo
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.id == 307565056 and .user.type == "Bot"
              and has("auto_merge") and .auto_merge == null
            ' <<<"$pull" >/dev/null
          else
            test "$REVIEW_ROUTE" = legacy
          fi
          if [ "$(jq -er .draft <<<"$pull")" = true ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg base "$GITHUB_SHA" --arg head "$HEAD_SHA" '
            .state == "open" and .draft == false
            and .base.ref == "main" and .base.sha == $base and .head.sha == $head
            and .head.repo.full_name == $repo and .user.login == "lightning-it-release-automation[bot]"
            and .user.id == 307565056 and .user.type == "Bot"
          ' <<<"$pull" >/dev/null
          if [ "$REVIEW_ROUTE" = legacy ]; then
            echo 'Native common control evaluates the Release App PR event.'
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --auto --merge --match-head-commit "$HEAD_SHA"
          else
            test "$REVIEW_ROUTE" = producer-only
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg ref "release/v${SECURITY_VERSION}" '
              .base.repo.full_name == $repo and .head.ref == $ref
              and has("auto_merge") and .auto_merge == null
            ' <<<"$pull" >/dev/null
            echo 'Native producer data is complete; PR remains open without auto-merge.'
          fi
