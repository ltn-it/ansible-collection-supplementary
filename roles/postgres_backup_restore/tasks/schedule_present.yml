---
- name: Reject symlinks in PostgreSQL backup implementation parent paths
  ansible.builtin.command:
    argv:
      - "{{ postgres_backup_restore_schedule_python_binary }}"
      - -c
      - >-
        import pathlib,sys;
        sys.exit(any(part.is_symlink() for value in sys.argv[1:]
        for part in (pathlib.Path(value), *pathlib.Path(value).parents)))
      - "{{ postgres_backup_restore_backup_dir }}"
      - "{{ postgres_backup_restore_schedule_pgdata_dir }}"
      - "{{ postgres_backup_restore_schedule_unit_dir }}"
      - "{{ postgres_backup_restore_schedule_worker }}"
      - "{{ postgres_backup_restore_schedule_config }}"
      - "/etc/cron.d/{{ postgres_backup_restore_schedule_cron_file }}"
      - >-
        {{ postgres_backup_restore_operations_log_file
           if postgres_backup_restore_operations_log_file | length > 0 else '/var/log' }}
  changed_when: false
  check_mode: false

- name: Validate PostgreSQL backup calendars with systemd
  ansible.builtin.command:
    argv: [systemd-analyze, calendar, "{{ item }}"]
  loop: "{{ postgres_backup_restore_schedule_calendar }}"
  changed_when: false
  check_mode: false
  when: postgres_backup_restore_schedule_backend == 'systemd'

- name: Verify the prepared cron daemon is running
  ansible.builtin.command:
    argv: [systemctl, is-active, crond.service]
  changed_when: false
  check_mode: false
  when: postgres_backup_restore_schedule_backend == 'cron'

- name: Verify the PostgreSQL backup cron timezone exists
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ postgres_backup_restore_schedule_cron_timezone }}"
    follow: true
  register: postgres_backup_restore_schedule_cron_zone
  when: postgres_backup_restore_schedule_backend == 'cron'

- name: Reject unknown PostgreSQL backup cron timezones
  ansible.builtin.assert:
    that:
      - postgres_backup_restore_schedule_cron_zone.stat.exists
      - postgres_backup_restore_schedule_cron_zone.stat.isreg | default(false)
  when: postgres_backup_restore_schedule_backend == 'cron'

- name: Inspect prepared PostgreSQL backup paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ postgres_backup_restore_backup_dir }}"
    - "{{ postgres_backup_restore_schedule_pgdata_dir }}"
    - "{{ postgres_backup_restore_schedule_home }}/.config"
    - "{{ postgres_backup_restore_schedule_home }}/.config/systemd"
    - "{{ postgres_backup_restore_schedule_unit_dir }}"
  register: postgres_backup_restore_schedule_paths

- name: Reject symlinked PostgreSQL backup or unit paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false))
    fail_msg: Backup, PGDATA and user-unit paths must be real directories.
  loop: "{{ postgres_backup_restore_schedule_paths.results }}"

- name: Refuse to repurpose an existing non-private PostgreSQL backup directory
  ansible.builtin.assert:
    that:
      - >-
        not postgres_backup_restore_schedule_paths.results[0].stat.exists or
        (postgres_backup_restore_schedule_paths.results[0].stat.uid == postgres_backup_restore_schedule_uid | int and
         postgres_backup_restore_schedule_paths.results[0].stat.mode == '0700')
      - postgres_backup_restore_schedule_paths.results[1].stat.exists
    fail_msg: Existing backup data must already be private to the application user; PGDATA must exist.

- name: Validate ownership of existing PostgreSQL backup user-unit directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.uid == postgres_backup_restore_schedule_uid | int
      - not item.stat.exists or not item.stat.woth | default(false)
      - not item.stat.exists or not item.stat.wgrp | default(false)
    fail_msg: Existing user-unit directories must belong only to the prepared application account.
  loop: "{{ postgres_backup_restore_schedule_paths.results[2:] }}"

- name: Read the running PostgreSQL image reference
  ansible.builtin.command:
    argv:
      - "{{ postgres_backup_restore_schedule_podman_binary }}"
      - inspect
      - --type
      - container
      - --format
      - "{{ '{{.ImageName}}' }}"
      - "{{ postgres_backup_restore_container_name }}"
  become: true
  become_user: "{{ postgres_backup_restore_schedule_user }}"
  environment: "{{ postgres_backup_restore_schedule_environment }}"
  args:
    chdir: "{{ postgres_backup_restore_schedule_home }}"
  changed_when: false
  check_mode: false
  register: postgres_backup_restore_schedule_running_image

- name: Validate the pinned PostgreSQL image before installing a schedule
  ansible.builtin.assert:
    that:
      - postgres_backup_restore_schedule_running_image.stdout | trim == postgres_backup_restore_schedule_image
    fail_msg: The existing PostgreSQL container does not use the explicitly pinned image.

- name: Create missing PostgreSQL backup user-unit directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: "{{ postgres_backup_restore_schedule_user }}"
    group: "{{ postgres_backup_restore_schedule_group }}"
    mode: "0700"
  loop: "{{ postgres_backup_restore_schedule_paths.results[2:] }}"
  when: not item.stat.exists

- name: Create the private PostgreSQL backup-set directory
  ansible.builtin.file:
    path: "{{ postgres_backup_restore_backup_dir }}"
    state: directory
    owner: "{{ postgres_backup_restore_schedule_user }}"
    group: "{{ postgres_backup_restore_schedule_group }}"
    mode: "0700"

- name: Inspect PostgreSQL backup implementation directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /usr/local/libexec
    - /etc/postgres-backup
  register: postgres_backup_restore_schedule_implementation_dirs

- name: Validate existing PostgreSQL backup implementation directories
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false) and not item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.uid == 0
      - not item.stat.exists or not item.stat.woth | default(false)
      - not item.stat.exists or not item.stat.wgrp | default(false)
    fail_msg: Backup implementation directories must be root-owned and not writable by other accounts.
  loop: "{{ postgres_backup_restore_schedule_implementation_dirs.results }}"

- name: Create missing PostgreSQL backup implementation directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ postgres_backup_restore_schedule_implementation_dirs.results }}"
  when: not item.stat.exists

- name: Install the checked worker and its explicitly selected admission
  ansible.builtin.include_tasks: schedule_worker.yml

- name: Install the PostgreSQL backup configuration
  ansible.builtin.template:
    src: scheduled-backup.json.j2
    dest: "{{ postgres_backup_restore_schedule_config }}"
    owner: root
    group: "{{ postgres_backup_restore_schedule_group }}"
    mode: "0640"
    validate: >-
      {{
        omit if ansible_check_mode else
        postgres_backup_restore_schedule_python_binary ~ ' ' ~
        postgres_backup_restore_schedule_worker ~ ' --config %s --validate'
      }}

- name: Prepare standard systemd backup output when explicitly selected
  ansible.builtin.include_tasks: schedule_output.yml
  when: postgres_backup_restore_operations_log_file | length > 0

- name: Install PostgreSQL backup user units
  ansible.builtin.template:
    src: "scheduled-backup.{{ item }}.j2"
    dest: "{{ postgres_backup_restore_schedule_unit_dir }}/{{ postgres_backup_restore_schedule_unit }}.{{ item }}"
    owner: "{{ postgres_backup_restore_schedule_user }}"
    group: "{{ postgres_backup_restore_schedule_group }}"
    mode: "0600"
  loop: [service, timer]
  notify: Postgres backup reload user manager

- name: Apply pending PostgreSQL backup user-unit reloads before managing the timer
  ansible.builtin.meta: flush_handlers

- name: Remove the inactive PostgreSQL backup cron trigger
  ansible.builtin.file:
    path: "/etc/cron.d/{{ postgres_backup_restore_schedule_cron_file }}"
    state: absent
  when: postgres_backup_restore_schedule_backend != 'cron' or not postgres_backup_restore_schedule_enabled

- name: Reconcile the PostgreSQL backup timer
  ansible.builtin.systemd_service:
    name: "{{ postgres_backup_restore_schedule_unit }}.timer"
    scope: user
    enabled: "{{ postgres_backup_restore_schedule_enabled and postgres_backup_restore_schedule_backend == 'systemd' }}"
    state: >-
      {{ 'started' if postgres_backup_restore_schedule_enabled and
         postgres_backup_restore_schedule_backend == 'systemd' else 'stopped' }}
  become: true
  become_user: "{{ postgres_backup_restore_schedule_user }}"
  environment: "{{ postgres_backup_restore_schedule_environment }}"
  when: not ansible_check_mode

- name: Install the daily PostgreSQL backup cron trigger
  ansible.builtin.template:
    src: scheduled-backup.cron.j2
    dest: "/etc/cron.d/{{ postgres_backup_restore_schedule_cron_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - postgres_backup_restore_schedule_backend == 'cron'
    - postgres_backup_restore_schedule_enabled
