---
- name: Inspect prepared component-log policy and entry point
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ postgres_backup_restore_schedule_log_worker }}"
    - "{{ postgres_backup_restore_schedule_log_config }}"
  register: postgres_backup_restore_schedule_log_files

- name: Require protected existing component-log implementation and policy
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - not item.stat.islnk | default(false)
      - item.stat.uid | default(-1) == 0
      - not item.stat.wgrp | default(true)
      - not item.stat.woth | default(true)
    fail_msg: Install and validate the root-owned component log policy before enabling capture.
  loop: "{{ postgres_backup_restore_schedule_log_files.results }}"

- name: Read the declared component-log policy contract
  ansible.builtin.slurp:
    src: "{{ postgres_backup_restore_schedule_log_config }}"
  register: postgres_backup_restore_schedule_log_policy_raw

- name: Verify the log policy belongs to this prepared database runtime
  ansible.builtin.assert:
    that:
      - postgres_backup_restore_schedule_log_policy.version == 1
      - postgres_backup_restore_schedule_log_policy.user_uid == postgres_backup_restore_schedule_uid | int
      - postgres_backup_restore_schedule_log_policy.container == postgres_backup_restore_container_name
      - postgres_backup_restore_schedule_log_policy.operational is sameas true
      - postgres_backup_restore_schedule_log_policy.directory is string
      - postgres_backup_restore_schedule_log_policy.directory is match('^/[A-Za-z0-9_./-]+$')
      - postgres_backup_restore_schedule_log_policy.directory != '/'
      - not postgres_backup_restore_schedule_log_policy.directory.endswith('/')
      - "'..' not in postgres_backup_restore_schedule_log_policy.directory.split('/')"
      - "'.' not in postgres_backup_restore_schedule_log_policy.directory.split('/')"
      - "'//' not in postgres_backup_restore_schedule_log_policy.directory"
      - postgres_backup_restore_schedule_log_policy.directory != postgres_backup_restore_backup_dir
      - postgres_backup_restore_schedule_log_policy.directory != postgres_backup_restore_schedule_pgdata_dir
      - >-
        not postgres_backup_restore_schedule_log_policy.directory.startswith(
          postgres_backup_restore_backup_dir + '/')
      - >-
        not postgres_backup_restore_schedule_log_policy.directory.startswith(
          postgres_backup_restore_schedule_pgdata_dir + '/')
      - >-
        not postgres_backup_restore_backup_dir.startswith(
          postgres_backup_restore_schedule_log_policy.directory + '/')
      - >-
        not postgres_backup_restore_schedule_pgdata_dir.startswith(
          postgres_backup_restore_schedule_log_policy.directory + '/')
    quiet: true
    fail_msg: Component log policy must match the database user/container and exclude backup and transaction data.
  vars:
    postgres_backup_restore_schedule_log_policy: >-
      {{ postgres_backup_restore_schedule_log_policy_raw.content | b64decode | from_json }}
