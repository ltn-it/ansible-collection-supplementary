---
postgres_backup_restore_action: "none"
postgres_backup_restore_allowed_actions:
  - none
  - backup
  - restore
  - schedule
postgres_backup_restore_execute: false

postgres_backup_restore_backup_dir: "/srv/postgres/backups"
postgres_backup_restore_file: >-
  {{ postgres_backup_restore_backup_dir }}/postgres-{{ postgres_backup_restore_db_name }}-{{
    ansible_date_time.iso8601_basic_short | default('manual')
  }}.dump
postgres_backup_restore_restore_source: "{{ postgres_backup_restore_file }}"
postgres_backup_restore_restore_confirm: ""
postgres_backup_restore_retention_keep_last: 14

postgres_backup_restore_db_name: "{{ postgres_deploy_db_name | default('postgres', true) }}"
postgres_backup_restore_db_user: "{{ postgres_deploy_db_user | default('postgres', true) }}"
postgres_backup_restore_db_password: "{{ postgres_deploy_db_password | default('', true) }}"
postgres_backup_restore_db_host: "{{ postgres_deploy_host_ip | default('127.0.0.1', true) }}"
postgres_backup_restore_db_port: "{{ postgres_deploy_port | default(5432, true) }}"

# custom uses pg_dump -Fc and pg_restore. plain uses SQL and psql.
postgres_backup_restore_format: "custom"
postgres_backup_restore_execution_mode: "client"
postgres_backup_restore_container_name: "{{ postgres_deploy_container_name | default('postgres', true) }}"
postgres_backup_restore_clean: true
postgres_backup_restore_if_exists: true
postgres_backup_restore_create_db: false
postgres_backup_restore_extra_pg_dump_args: []
postgres_backup_restore_extra_pg_restore_args: []
postgres_backup_restore_extra_psql_args: []

# Scheduled backups use an already running, digest-pinned rootless Podman
# container and its existing local Unix-socket authentication. No OS provisioning.
postgres_backup_restore_schedule_state: present
postgres_backup_restore_schedule_enabled: false
postgres_backup_restore_schedule_backend: systemd
# Cron uses an explicitly named timezone and one daily start time.
postgres_backup_restore_schedule_cron_timezone: UTC
postgres_backup_restore_schedule_cron_hour: 0
postgres_backup_restore_schedule_cron_minute: 0
postgres_backup_restore_schedule_cron_file: "{{ postgres_backup_restore_schedule_unit }}"
postgres_backup_restore_schedule_instance: ""
postgres_backup_restore_schedule_user: ""
postgres_backup_restore_schedule_group: ""
postgres_backup_restore_schedule_uid: 0
postgres_backup_restore_schedule_home: ""
postgres_backup_restore_schedule_pgdata_dir: ""
postgres_backup_restore_schedule_pgdata_mount: /var/lib/postgresql/data
postgres_backup_restore_schedule_socket_dir: /var/run/postgresql
postgres_backup_restore_schedule_socket_port: 5432
postgres_backup_restore_schedule_image: "{{ postgres_deploy_image | default('', true) }}"
postgres_backup_restore_schedule_source_revision: ""
postgres_backup_restore_schedule_calendar:
  - "*-*-* 00:00:00 UTC"
postgres_backup_restore_schedule_after: []
postgres_backup_restore_schedule_retention_days: 14
postgres_backup_restore_schedule_min_free_percent: 20
postgres_backup_restore_schedule_timeout_seconds: 1800
postgres_backup_restore_schedule_max_age_seconds: 90000
postgres_backup_restore_schedule_podman_binary: /usr/bin/podman
postgres_backup_restore_schedule_python_binary: /usr/bin/python3
postgres_backup_restore_schedule_unit: "postgres-backup-{{ postgres_backup_restore_schedule_instance }}"
# One host-wide implementation can serve multiple instance-specific configurations.
postgres_backup_restore_schedule_worker: /usr/local/libexec/postgres-backup.py
# Optional existing shared component-log policy; no helper installation or trust changes here.
postgres_backup_restore_schedule_log_config: ""
postgres_backup_restore_schedule_log_worker: /usr/local/libexec/podman-component-logs/main.py
postgres_backup_restore_schedule_config: >-
  /etc/postgres-backup/{{ postgres_backup_restore_schedule_instance }}.json
postgres_backup_restore_schedule_unit_dir: "{{ postgres_backup_restore_schedule_home }}/.config/systemd/user"
postgres_backup_restore_schedule_environment:
  HOME: "{{ postgres_backup_restore_schedule_home }}"
  XDG_RUNTIME_DIR: "/run/user/{{ postgres_backup_restore_schedule_uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ postgres_backup_restore_schedule_uid }}/bus"
