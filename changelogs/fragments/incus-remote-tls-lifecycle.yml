---
minor_changes:
  - Incus Molecule lifecycle - add an explicit pre-admitted TLS transport for the complete existing
    create, guest connection, evidence and destroy path, with pinned server identity and hard project quotas.
bugfixes:
  - Incus Molecule TLS preflight - retain exact-owned logical quota credit without adding configured guest RAM
    to physical host headroom; every VM or container restart requires the complete requested RAM to be free.
  - Incus Molecule lifecycle - apply container UID-map isolation only to container targets when the same
    scenario selects a VM at runtime; retain other requested configuration and legacy container isolation.
  - Incus Molecule destroy - enumerate instance names as CSV before exact-owner checks instead of treating JSON lines
    as instance names.
  - Incus Molecule TLS lifecycle - avoid local controller KVM/resource/firewall assumptions and blind network-create
    or readiness-start retries while retaining actual VM initialization, start, agent and network checks.
  - Incus Molecule TLS lifecycle - explicitly require TLS 1.2 or newer in the client and its mutual-TLS test server.
  - Collection policy tests - run the complete discoverable unit suite in the pinned Devtools image with its
    declared Incus and Vault dependencies, preserving the Vault runtime contract checks.
